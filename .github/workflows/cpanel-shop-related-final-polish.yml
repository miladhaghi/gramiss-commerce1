name: cPanel Shop Related Final Polish

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/shop-related-final-polish'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Shop and related product cards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(fn, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(), data=data if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r: payload=json.loads(r.read().decode())
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result.get('errors') if isinstance(result,dict) else result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 {fn}: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for key in ('content','file_content','data'):
                      if isinstance(d.get(key),str): return d[key]
              if isinstance(d,str): return d
              raise RuntimeError('Unexpected content: '+rel)

          def save(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          def replace_block(base,start,end,patch):
              if start in base and end in base:
                  base=base.split(start,1)[0].rstrip()+base.split(end,1)[1]
              return base.rstrip()+'\n\n'+start+'\n'+patch.strip()+'\n'+end+'\n'

          shop_patch=Path('deploy/final-polish/shop-final-polish.css').read_text(encoding='utf-8')
          related_patch=Path('deploy/final-polish/related-final-polish.css').read_text(encoding='utf-8')
          shop=read('assets/css/shop-sculpted.css'); related=read('assets/css/pdp-related-sculpted.css'); header=read('header.php')

          shop_new=replace_block(shop,'/* GRAMISS_SHOP_FINAL_POLISH_START */','/* GRAMISS_SHOP_FINAL_POLISH_END */',shop_patch)
          related_new=replace_block(related,'/* GRAMISS_RELATED_FINAL_POLISH_START */','/* GRAMISS_RELATED_FINAL_POLISH_END */',related_patch)
          header_new=re.sub(r'shop-sculpted\.css\?v=[0-9A-Za-z._-]+','shop-sculpted.css?v=20260813-9',header)
          header_new=re.sub(r'pdp-related-sculpted\.css\?v=[0-9A-Za-z._-]+','pdp-related-sculpted.css?v=20260813-3',header_new)
          if 'shop-sculpted.css?v=20260813-9' not in header_new: raise RuntimeError('Shop CSS cache version bump failed')
          if 'pdp-related-sculpted.css?v=20260813-3' not in header_new: raise RuntimeError('Related CSS cache version bump failed')

          save(f'assets/css/shop-sculpted.css.bak-finalpolish-{stamp}',shop)
          save(f'assets/css/pdp-related-sculpted.css.bak-finalpolish-{stamp}',related)
          save(f'header.php.bak-finalpolish-{stamp}',header)
          print('Backups created: '+stamp)
          save('assets/css/shop-sculpted.css',shop_new)
          save('assets/css/pdp-related-sculpted.css',related_new)
          save('header.php',header_new)

          s=read('assets/css/shop-sculpted.css'); r=read('assets/css/pdp-related-sculpted.css'); h=read('header.php')
          sf=''.join(s.split()); rf=''.join(r.split())
          checks={
            'shop final marker':'GRAMISS_SHOP_FINAL_POLISH_V1' in s,
            'shop four columns':'grid-template-columns:repeat(4,minmax(0,1fr))!important' in sf,
            'shop white media':'background-color:#fff!important' in sf and 'brightness(1.035)' in s,
            'shop strips reset':'shop-strip' in s and 'background:transparent!important' in sf,
            'related final marker':'GRAMISS_RELATED_FINAL_POLISH_V1' in r,
            'related four columns':'grid-template-columns:repeat(4,minmax(0,1fr))!important' in rf,
            'related shop-size image':'height:350px!important' in rf,
            'related white canvas':'background-color:#fff!important' in rf and 'brightness(1.035)' in r,
            'shop cache bump':'shop-sculpted.css?v=20260813-9' in h,
            'related cache bump':'pdp-related-sculpted.css?v=20260813-3' in h,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('Final Shop/related polish verification failed')
          print('LIVE SHOP + RELATED FINAL POLISH DEPLOYED AND VERIFIED')
          PY
