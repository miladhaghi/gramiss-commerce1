name: cPanel Shop Runtime Final Fix

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/shop-runtime-final-fix'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wordpress-migration
      - name: Deploy Shop runtime final fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          from pathlib import Path
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())
          def call(fn,p,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(p).encode(); last=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post:req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=45) as r: payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result.get('errors') if isinstance(result,dict) else result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/3 {fn}: {exc}')
                      if attempt<3: time.sleep(attempt*2)
              raise last
          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(rel)
          def save(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          css=Path('wordpress/gramiss-theme/assets/css/shop-runtime-final-fix.css').read_text(encoding='utf-8')
          required=['GRAMISS_SHOP_RUNTIME_FINAL_FIX_V1','main#primary > h1.page-title','justify-content: flex-end','gse-sort-button']
          if not all(x in css for x in required): raise SystemExit('Final fix source markers missing')
          if '.gse-media-frame' in css or 'ul.products' in css: raise SystemExit('Product sizing selectors are forbidden in this fix')

          header=read('header.php')
          save(f'header.php.bak-shop-runtime-final-{stamp}',header)
          try:
              old=read('assets/css/shop-runtime-final-fix.css'); save(f'assets/css/shop-runtime-final-fix.css.bak-{stamp}',old)
          except Exception: pass
          save('assets/css/shop-runtime-final-fix.css',css)

          # Remove the earlier alignment experiment so it cannot override the physical alignment rules.
          header_new=re.sub(r'\s*<!-- GRAMISS SHOP ALIGNMENT FIX START -->.*?<!-- GRAMISS SHOP ALIGNMENT FIX END -->\s*','\n',header,flags=re.S)
          header_new=re.sub(r'\s*<link[^>]+id=["\']gramiss-shop-alignment-fix-css["\'][^>]*>\s*','\n',header_new,flags=re.I)
          start='<!-- GRAMISS SHOP RUNTIME FINAL FIX START -->'; end='<!-- GRAMISS SHOP RUNTIME FINAL FIX END -->'
          block=start+'\n<link id="gramiss-shop-runtime-final-fix-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . \'/assets/css/shop-runtime-final-fix.css?v=20260820-2\' ); ?>">\n'+end
          if start in header_new and end in header_new:
              header_new=header_new.split(start,1)[0]+block+header_new.split(end,1)[1]
          elif '</head>' in header_new:
              header_new=header_new.replace('</head>',block+'\n</head>',1)
          else: raise SystemExit('No </head> in live header')
          save('header.php',header_new)

          liveh=read('header.php'); livecss=read('assets/css/shop-runtime-final-fix.css')
          checks={
            'new loader':'shop-runtime-final-fix.css?v=20260820-2' in liveh,
            'old alignment loader removed':'gramiss-shop-alignment-fix-css' not in liveh,
            'first-paint main gate':'html.gramiss-shop-cleaning body.post-type-archive-product main#primary' in livecss,
            'legacy title hidden':'main#primary > h1.page-title' in livecss,
            'stale main pseudo removed':'main#primary::before' in livecss and 'main#primary::after' in livecss,
            'hero physical right':'direction: ltr !important' in livecss and 'justify-content: flex-end !important' in livecss,
            'sort optical center':'padding: 3px 14px 0 !important' in livecss and 'align-items: center !important' in livecss,
            'product sizing untouched':'.gse-media-frame' not in livecss and 'ul.products' not in livecss,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if not all(checks.values()): raise SystemExit('Live file verification failed')

          url='https://gramiss.ir/?'+urllib.parse.urlencode({'post_type':'product','_gramiss_runtime_final':stamp})
          req=urllib.request.Request(url,headers={'User-Agent':'GramissDeployCheck/2.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=45) as r: html=r.read().decode('utf-8','replace'); status=r.status
          print('Shop HTTP status:',status)
          if status!=200 or 'shop-runtime-final-fix.css?v=20260820-2' not in html: raise SystemExit('Live HTML verification failed')
          if 'gramiss-shop-alignment-fix-css' in html: raise SystemExit('Old alignment loader still present in served HTML')

          cssurl='https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/css/shop-runtime-final-fix.css?v=20260820-2&_verify='+stamp
          req=urllib.request.Request(cssurl,headers={'User-Agent':'GramissDeployCheck/2.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=45) as r: served=r.read().decode('utf-8','replace'); css_status=r.status
          print('Fix CSS HTTP status:',css_status)
          if css_status!=200 or 'GRAMISS_SHOP_RUNTIME_FINAL_FIX_V1' not in served: raise SystemExit('Served fix CSS verification failed')
          print('LIVE SHOP RUNTIME FINAL FIX DEPLOYED')
          PY
