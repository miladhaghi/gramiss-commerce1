name: SEO Category Money Page Content Wave 1

on:
  workflow_dispatch:

jobs:
  guarded-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hardened publisher
        run: python3 .ops/prepare-category-money-page-content-wave1-v2.py
      - name: Compile hardened publisher
        run: python3 -m py_compile .ops/category-money-page-content-wave1.generated-v2.py
      - name: Publish category money page content wave 1
        run: python3 .ops/category-money-page-content-wave1.generated-v2.py
