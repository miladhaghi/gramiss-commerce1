name: cPanel Home Journal V6 Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cpanel-home-journal-v6-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Journal images from Canva CDN at full size
        shell: bash
        run: |
          set -euo pipefail
          FIT='https://media.canva.com/v2/image-resize/format:WEBP/height:431/quality:100/uri:ifs%3A%2F%2FM%2F5d134948-322b-4949-9cf7-5cb38d9cf72d/watermark:F/width:1100?csig=AAAAAAAAAAAAAAAAAAAAAKNLdaOUmfEoansN8Mmd-89zBjBtydKJuu11ZQ_Qyfr_&exp=1789226987&osig=AAAAAAAAAAAAAAAAAAAAAHRq2cn6YC-sikdYvPPAHcJTBVx8VFM2DK-k1ss4nt_R&signer=media-rpc'
          MATERIAL='https://media.canva.com/v2/image-resize/format:WEBP/height:431/quality:100/uri:ifs%3A%2F%2FM%2Fe4ca5487-7ece-465a-a7a0-39da2130842c/watermark:F/width:1100?csig=AAAAAAAAAAAAAAAAAAAAALBVYTlmPJ1kJTaeXnCt1kqn_7RlRSsCTC1omhwfZPqC&exp=1789227914&osig=AAAAAAAAAAAAAAAAAAAAAGaeqng8_efT2z9o8Wl1oNYizIx48USJXbf-aj4i-SJp&signer=media-rpc'
          STYLE='https://media.canva.com/v2/image-resize/format:WEBP/height:431/quality:100/uri:ifs%3A%2F%2FM%2Fbef54c11-1513-4a2a-b0d5-0f94408cd5d9/watermark:F/width:1100?csig=AAAAAAAAAAAAAAAAAAAAAPL3RWVdR0gbvzmduq0HO6XuZmJHJ_0dHspnc2C7mCgd&exp=1789227483&osig=AAAAAAAAAAAAAAAAAAAAAG1PNpJ6TItlLfW124BLnFNBz6M3PMKseo9kLEnb490v&signer=media-rpc'
          curl --fail --location --retry 3 --silent --show-error "$FIT" -o fit.webp
          curl --fail --location --retry 3 --silent --show-error "$MATERIAL" -o material.webp
          curl --fail --location --retry 3 --silent --show-error "$STYLE" -o style.webp
          file fit.webp material.webp style.webp
          python3 - <<'PY'
          from pathlib import Path
          def webp_dims(path):
              b=Path(path).read_bytes()
              if b[:4]!=b'RIFF' or b[8:12]!=b'WEBP': raise SystemExit(f'not webp: {path}')
              # VP8 lossy frame header dimensions
              i=b.find(b'VP8 ')
              if i>=0:
                  p=i+8
                  d=b[p:p+10]
                  if d[3:6]!=b'\x9d\x01\x2a': raise SystemExit(f'bad VP8 header: {path}')
                  w=int.from_bytes(d[6:8],'little') & 0x3fff
                  h=int.from_bytes(d[8:10],'little') & 0x3fff
                  return w,h,len(b)
              i=b.find(b'VP8X')
              if i>=0:
                  p=i+12
                  w=1+int.from_bytes(b[p+4:p+7],'little')
                  h=1+int.from_bytes(b[p+7:p+10],'little')
                  return w,h,len(b)
              raise SystemExit(f'unsupported webp: {path}')
          for f in ('fit.webp','material.webp','style.webp'):
              w,h,n=webp_dims(f)
              print(f, w,h,n)
              if (w,h)!=(1100,431) or n<10000: raise SystemExit(f'bad dimensions/size: {f}')
          print('PROBE_OK')
          PY
