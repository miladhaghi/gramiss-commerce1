name: SEO Content Architecture V1

on:
  push:
    branches: [ops/seo-content-architecture-v1]

jobs:
  editorial-foundation-audit-v5:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Audit editorial foundation v5
        run: python3 .ops/editorial-foundation-audit-v5.py
      - name: Validate wave 16-17 publisher
        run: |
          python3 -m py_compile .ops/editorial-wave-16-17-v2.py
          python3 - <<'PY'
          import ast, pathlib
          tree=ast.parse(pathlib.Path('.ops/editorial-wave-16-17-v2.py').read_text())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(isinstance(t,ast.Name) and t.id=='php' for t in node.targets) and isinstance(node.value, ast.Constant):
                  pathlib.Path('/tmp/wave1617.php').write_text(node.value.value)
                  break
          else:
              raise SystemExit('main php payload not found')
          PY
          php -l /tmp/wave1617.php
      - name: Publish guarded editorial wave 16-17
        run: python3 .ops/editorial-wave-16-17-v2.py
