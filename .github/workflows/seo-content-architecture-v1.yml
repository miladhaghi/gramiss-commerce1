name: SEO Content Architecture V1

on:
  push:
    branches: [ops/seo-content-architecture-v1]

jobs:
  publisher-disabled-checkpoint-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm publisher is disabled
        run: |
          python3 -m py_compile .ops/editorial-wave-16-17-v2.py
          echo "Wave 16-17 publisher disabled; preparing 17-article checkpoint audit."
