name: SEO Content Architecture V1

on:
  push:
    branches: [ops/seo-content-architecture-v1]

jobs:
  product-contract-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate product intake and gate code
        run: |
          python3 -m py_compile .ops/validate-product-intake-v1.py .ops/product-prepublish-gate-v1.py
          python3 .ops/validate-product-intake-v1.py --self-test
          python3 .ops/product-prepublish-gate-v1.py --self-test

  measurement-tool-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate measurement and GSC tools
        run: |
          python3 -m py_compile \
            .ops/search-console-readiness-audit-v1.py \
            .ops/search-console-export-analyzer-v1.py \
            .ops/gsc-activation-preflight-v1.py \
            .ops/gsc-verification-file-publisher-v1.py
          python3 .ops/search-console-export-analyzer-v1.py --self-test
          python3 .ops/gsc-verification-file-publisher-v1.py --self-test

  production-readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Audit final editorial foundation v7
        run: python3 .ops/editorial-foundation-audit-v7.py
      - name: Compile current category money-page guard
        run: python3 -m py_compile .ops/category-money-page-audit-v2.py
      - name: Audit all current product category money pages
        run: python3 .ops/category-money-page-audit-v2.py | tee /tmp/category-money-page-final.log
      - name: Assert 21 of 21 category money pages pass
        run: |
          grep -F 'GRAMISS_CATEGORY_AUDIT_V2_BASELINE product=49 product_cat=21' /tmp/category-money-page-final.log
          grep -F 'CATEGORY_AUDIT_SUMMARY {"P0": 0, "P1": 0, "P2": 0, "PASS": 21, "total": 21}' /tmp/category-money-page-final.log
          grep -F 'SAFETY_ERRORS []' /tmp/category-money-page-final.log
          grep -F 'PASS CATEGORY MONEY PAGE AUDIT V1 READ ONLY' /tmp/category-money-page-final.log
      - name: GSC crawl and sitemap preflight
        run: python3 .ops/gsc-activation-preflight-v1.py
