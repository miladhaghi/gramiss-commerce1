name: SEO Content Architecture V1

on:
  push:
    branches: [ops/seo-content-architecture-v1]

jobs:
  editorial-wave-10-11:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded publisher
        run: |
          python3 -m py_compile .ops/editorial-wave-10-11.py
          python3 -c "import ast,pathlib; tree=ast.parse(pathlib.Path('.ops/editorial-wave-10-11.py').read_text()); values={node.targets[0].id:ast.literal_eval(node.value) for node in ast.walk(tree) if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ('php','rollback_php')}; [pathlib.Path('/tmp/'+name+'.php').write_text(value) for name,value in values.items()]; assert set(values)=={'php','rollback_php'}"
          php -l /tmp/php.php
          php -l /tmp/rollback_php.php
      - name: Publish and verify editorial wave 10-11
        run: python3 .ops/editorial-wave-10-11.py
