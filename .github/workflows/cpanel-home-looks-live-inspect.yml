name: cPanel Home Looks Live Inspect

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    if: github.head_ref == 'ops/home-looks-surgical'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Inspect exact live Home anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,ssl,urllib.parse,urllib.request,re,hashlib
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context()
          def call(fn,params):
              url=f'https://{host}:2083/execute/Fileman/{fn}?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Authorization':f'cpanel {user}:{token}'})
              with urllib.request.urlopen(req,context=ctx,timeout=75) as r: obj=json.loads(r.read().decode('utf-8','replace'))
              result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
              if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
              return result.get('data')
          d=call('get_file_content',{'dir':root,'file':'front-page.php','from_charset':'_DETECT_','to_charset':'utf-8'})
          if isinstance(d,dict):
              text=next((d[k] for k in ('content','file_content','data') if isinstance(d.get(k),str)),None)
          else:text=d
          if not isinstance(text,str): raise SystemExit('Could not read live front-page')
          print('LIVE_FRONT_BYTES',len(text.encode()))
          print('LIVE_FRONT_SHA',hashlib.sha256(text.encode()).hexdigest())
          lines=text.splitlines()
          for i,line in enumerate(lines,1):
              low=line.lower()
              if '<section' in low or 'collections' in low or 'category' in low or 'signal-strip' in low or 'get_footer' in low:
                  print(f'ANCHOR {i}: {line[:500]}')
          for needle in ['id="collections"',"id='collections'",'g1-signal-strip','SHOP BY CATEGORY','get_footer();']:
              pos=text.find(needle)
              print('NEEDLE',repr(needle),'POS',pos)
              if pos>=0:
                  print('SNIPPET_START')
                  print(text[max(0,pos-900):min(len(text),pos+1200)])
                  print('SNIPPET_END')
          PY
