name: cPanel Home Looks Live Inspect

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    if: github.head_ref == 'ops/home-looks-surgical'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Inspect exact live Home and Look assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,ssl,urllib.parse,urllib.request,hashlib
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context()
          def call(fn,params):
              url=f'https://{host}:2083/execute/Fileman/{fn}?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Authorization':f'cpanel {user}:{token}'})
              with urllib.request.urlopen(req,context=ctx,timeout=75) as r: obj=json.loads(r.read().decode('utf-8','replace'))
              result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
              if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
              return result.get('data')
          def text_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else root+'/'+parent
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict): return next((d[k] for k in ('content','file_content','data') if isinstance(d.get(k),str)),None)
              return d
          text=text_file('front-page.php')
          if not isinstance(text,str): raise SystemExit('Could not read live front-page')
          print('LIVE_FRONT_BYTES',len(text.encode()))
          print('LIVE_FRONT_SHA',hashlib.sha256(text.encode()).hexdigest())
          print('HERO', 'g1-floating-hero' in text, 'SIGNAL', 'g1-signal-strip' in text, 'LOOKS', 'data-g1-looks' in text, 'COLLECTIONS', 'id="collections"' in text)
          for needle in ['g1-signal-strip','id="collections"','SHOP BY CATEGORY']:
              print('NEEDLE',needle,'POS',text.find(needle))
          PY
          for n in 01 02; do
            url="https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/images/home/gramiss-look-${n}.webp?inspect=${GITHUB_RUN_ID}"
            code=$(curl -L --retry 2 --connect-timeout 15 --max-time 60 -sS -w '%{http_code}' -o "look-${n}.webp" "$url")
            bytes=$(wc -c < "look-${n}.webp")
            sha=$(sha256sum "look-${n}.webp" | awk '{print $1}')
            header=$(xxd -p -l 12 "look-${n}.webp" || true)
            echo "LOOK${n} HTTP=${code} bytes=${bytes} sha256=${sha} header=${header}"
            file "look-${n}.webp" || true
          done
