name: About Support V2 Cache Bust

on:
  push:
    branches: [ops/about-support-v1]

jobs:
  deploy-about-v2-cache-bust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint About template
        run: php -l wordpress/theme/gramiss-theme-next/page-about-gramiss.php
      - name: Compile guarded deployer
        run: python3 -m py_compile .ops/deploy-about-cache-bust-v3.py
      - name: Deploy About V2 cache bust only
        run: python3 .ops/deploy-about-cache-bust-v3.py
