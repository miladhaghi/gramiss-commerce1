name: About Gramiss V2

on:
  push:
    branches: [ops/about-support-v1]

jobs:
  deploy-about-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint About Gramiss V2
        run: php -l wordpress/theme/gramiss-theme-next/page-about-gramiss.php
      - name: Compile guarded V2 deployer
        run: python3 -m py_compile .ops/deploy-about-gramiss-v2.py
      - name: Deploy and verify approved About Gramiss V2
        run: python3 .ops/deploy-about-gramiss-v2.py
