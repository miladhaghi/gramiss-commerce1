name: About Support V3

on:
  push:
    branches: [ops/about-support-v1]

jobs:
  verify-about-support-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint About template
        run: php -l wordpress/theme/gramiss-theme-next/page-about-gramiss.php
      - name: Compile verify-only guard
        run: python3 -m py_compile .ops/verify-about-support-v3.py
      - name: Verify live About Support V3 read only
        run: python3 .ops/verify-about-support-v3.py
