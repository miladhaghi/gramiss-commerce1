name: About Support V1

on:
  push:
    branches: [ops/about-support-v1]

jobs:
  inspect-live-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile inspector
        run: python3 -m py_compile .ops/inspect-about-support-live.py
      - name: Inspect live header footer and mobile menu
        run: python3 .ops/inspect-about-support-live.py
