name: About Support V2

on:
  push:
    branches: [ops/about-support-v1]

jobs:
  verify-about-support-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint Gramiss information sources
        run: |
          php -l wordpress/theme/gramiss-theme-next/page-about-gramiss.php
          php -l wordpress/theme/gramiss-theme-next/page-contact.php
          php -l wordpress/plugins/gramiss-site-info/gramiss-site-info.php
      - name: Compile verifiers
        run: |
          python3 -m py_compile .ops/verify-about-support-v1.py
          python3 -m py_compile .ops/inspect-about-cache-v1.py
          python3 -m py_compile .ops/inspect-about-css-http-v1.py
      - name: Verify live About Support V2 read only
        run: python3 .ops/verify-about-support-v1.py
      - name: Compare plain and cache-busted About page
        run: python3 .ops/inspect-about-cache-v1.py
      - name: Verify public About V2 stylesheet response
        run: python3 .ops/inspect-about-css-http-v1.py
