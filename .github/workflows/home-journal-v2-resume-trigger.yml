name: Home Journal V2 Resume Trigger

on:
  issue_comment:
    types: [created]

jobs:
  deploy:
    if: github.event.issue.pull_request && github.event.comment.body == '/resume-home-journal-v2'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resume guarded Home Journal V2 deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path

          src=Path('.github/workflows/cpanel-home-journal-v2.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          block=src[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]

          patched=[]
          guard_old=False
          for line in lines:
              if "if 'GRAMISS_HOME_JOURNAL_V2' in front:" in line:
                  patched.append("journal_already = 'GRAMISS_HOME_JOURNAL_V2' in front")
                  continue
              if line.startswith('old=re.search('):
                  patched.append('old=None')
                  patched.append('if not journal_already:')
                  patched.append('    '+line)
                  guard_old=True
                  continue
              if guard_old and (line.startswith('if not old:') or line.startswith("if front.count('id=\\\"journal\\\"')") or line.startswith("if front.count('id=\"journal\"')")):
                  patched.append('    '+line)
                  if line.startswith('if front.count'):
                      guard_old=False
                  continue
              if line.startswith('front=front[:old.start()]'):
                  patched.append('if not journal_already:')
                  patched.append('    '+line)
                  continue
              if line.startswith("if after!=content: raise SystemExit('LIVE WRITE MISMATCH: '+rel)"):
                  patched.extend([
                      "if rel=='front-page.php': ok=isinstance(after,str) and 'GRAMISS_HOME_JOURNAL_V2' in after and 'gj2-featured' in after",
                      "elif rel=='header.php': ok=isinstance(after,str) and 'gramiss-home-journal-v2.css' in after",
                      "elif rel.endswith('gramiss-home-journal-v2.css'): ok=isinstance(after,str) and 'GRAMISS_HOME_JOURNAL_V2' in after and '.gj2-featured' in after",
                      "else: ok=(after==content)",
                      "if not ok: raise SystemExit('LIVE WRITE SEMANTIC MISMATCH: '+rel)",
                  ])
                  continue
              patched.append(line)

          script='\n'.join(patched)+'\n'
          required=["journal_already = 'GRAMISS_HOME_JOURNAL_V2' in front",'if not journal_already:',"LIVE WRITE SEMANTIC MISMATCH"]
          if not all(x in script for x in required):
              raise SystemExit('ABORT: resume patch construction failed')
          Path('/tmp/home_journal_v2_resume.py').write_text(script,encoding='utf-8')
          PYEXTRACT
          python3 /tmp/home_journal_v2_resume.py
