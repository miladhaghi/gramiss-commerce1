name: cPanel Gramiss Branding V1

on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    if: github.head_ref == 'ops/branding-site-v1'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Capture final live branding selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, urllib.parse, urllib.request, re
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context()
          def call(fn,params):
              url=f'https://{host}:2083/execute/Fileman/{fn}?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Authorization':f'cpanel {user}:{token}'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: obj=json.loads(r.read().decode('utf-8','replace'))
              result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
              if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
              return result.get('data')
          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else root+'/'+parent
              try: d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              except Exception as e: print('READERR',rel,repr(e)); return None
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              return d if isinstance(d,str) else None
          def contexts(label,text,needle,before=650,after=1500,which='all'):
              if not isinstance(text,str): print('NOFILE',label); return
              pos=[m.start() for m in re.finditer(re.escape(needle),text)]
              print('POSITIONS',label,needle,pos[-20:])
              if which=='first': pos=pos[:1]
              elif which=='last': pos=pos[-1:]
              else: pos=pos[:6]
              for i in pos:
                  sn=re.sub(r'\s+',' ',text[max(0,i-before):min(len(text),i+after)]).strip()
                  print('CTX',label,needle,'@',i,':',sn[:2600])
          header=read('header.php')
          print('=== DESKTOP HEADER WORDMARK ===')
          contexts('header',header,'wordmark',900,1600,'first')
          contexts('header',header,'wp_head()',800,600,'first')
          print('=== SMART CSS ===')
          for f in ['assets/css/gramiss-1.css','assets/css/gramiss-release.css','assets/css/theme.css']:
              t=read(f)
              for n in ['.g1-smart-core','.g1-smart-map','.wordmark','.footer-wordmark']:
                  contexts(f,t,n,500,1500,'all')
          print('=== SHOP CSS ===')
          for f in ['assets/css/shop.css','assets/css/shop-premium.css','assets/css/shop-premium-shell.css','assets/css/shop-runtime-final-fix.css','assets/css/shop-alignment-fix.css','assets/css/shop-sculpted.css','assets/css/shop-editorial.css']:
              t=read(f)
              print('FILE',f,'BYTES',len(t.encode()) if isinstance(t,str) else -1)
              for n in ['.shop-intro','content:"G"',"content:'G'",'content: "G"',"content: 'G'",'::before','::after']:
                  contexts(f,t,n,450,1400,'all')
          PY
