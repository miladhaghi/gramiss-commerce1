name: cPanel eNAMAD LiteSpeed Purge V2

on:
  pull_request:
    branches: [main]

jobs:
  purge:
    if: github.head_ref == 'ops/enamad-purge-v2'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wordpress-migration
      - name: Purge LiteSpeed and verify eNAMAD on plain homepage
        run: python3 deploy/enamad/purge_litespeed_enamad_v2.py
