name: cPanel Shop Sculpted Final

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/shop-sculpted-final'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Deploy final sculpted Shop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(fn, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'
              data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(), data=data if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r: payload=json.loads(r.read().decode())
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result.get('errors') if isinstance(result,dict) else result))
                      return result.get('data')
                  except Exception as e:
                      last=e; print(f'Attempt {attempt}/5 {fn}: {e}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              if isinstance(d,str): return d
              raise RuntimeError('Unexpected content: '+rel)

          def save(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          css=Path('deploy/shop-sculpted/shop-sculpted.css').read_text(encoding='utf-8')
          js=Path('deploy/shop-sculpted/shop-sculpted.js').read_text(encoding='utf-8')
          header=read('header.php')
          start='<!-- GRAMISS SHOP EDITORIAL START -->'; end='<!-- GRAMISS SHOP EDITORIAL END -->'
          block=start+"\n<?php\n$gramiss_shop_catalog = false;\nif ( function_exists( 'is_shop' ) ) {\n  $gramiss_shop_catalog = is_shop() || ( function_exists( 'is_product_taxonomy' ) && is_product_taxonomy() ) || is_post_type_archive( 'product' ) || ( is_search() && 'product' === get_query_var( 'post_type' ) );\n}\nif ( $gramiss_shop_catalog ) { add_filter( 'single_product_archive_thumbnail_size', function( $size ) { return 'full'; }, 999 ); }\nif ( $gramiss_shop_catalog ) : ?>\n<script id=\"gramiss-shop-first-paint-gate\">(function(d,w){d.documentElement.classList.add('gramiss-shop-booting');w.setTimeout(function(){d.documentElement.classList.remove('gramiss-shop-booting');},3200);})(document,window);</script>\n<style id=\"gramiss-shop-first-paint-style\">html.gramiss-shop-booting body main.site-main,html.gramiss-shop-booting body #main{visibility:hidden!important;opacity:0!important;pointer-events:none!important;min-height:72vh!important}</style>\n<link id=\"gramiss-shop-sculpted-css\" rel=\"stylesheet\" href=\"<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/shop-sculpted.css?v=20260812-5' ); ?>\">\n<script id=\"gramiss-shop-sculpted-js\" defer src=\"<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/shop-sculpted.js?v=20260812-5' ); ?>\"></script>\n<?php endif; ?>\n"+end
          if start in header and end in header: new_header=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header: new_header=header.replace('</head>',block+'\n</head>',1)
          else: raise RuntimeError('header marker not found')

          save(f'header.php.bak-shopsculpted-{stamp}',header); print('Backup: header.php.bak-shopsculpted-'+stamp)
          save('assets/css/shop-sculpted.css',css); save('assets/js/shop-sculpted.js',js); save('header.php',new_header)
          h=read('header.php'); c=read('assets/css/shop-sculpted.css'); j=read('assets/js/shop-sculpted.js')
          checks={
            'loader':'shop-sculpted.css?v=20260812-5' in h and 'shop-sculpted.js?v=20260812-5' in h,
            'no flash':'gramiss-shop-first-paint-gate' in h,
            'full images':"return 'full'" in h,
            'css':'GRAMISS_SHOP_SCULPTED_V1' in c,
            'gradient':'linear-gradient(180deg,#fff 0%,#f2f3f4 52%,#fff 100%)' in ''.join(c.split()),
            'white image canvas':'gse-media-frame' in c and 'background:#fff!important' in c,
            'top action':'gse-action-orb' in c and 'top:18px' in c,
            'bottom shape':'gse-info-panel' in c and 'border-top-right-radius:64px' in c,
            'js':'GRAMISS_SHOP_SCULPTED_V1' in j and 'ensureInfoPanel' in j and 'ensureActionOrb' in j,
            'boot release':"classList.remove('gramiss-shop-booting')" in j,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if not all(checks.values()): raise SystemExit('verification failed')
          print('LIVE SHOP SCULPTED FINAL DEPLOYED AND VERIFIED')
          PY
