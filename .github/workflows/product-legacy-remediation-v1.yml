name: Product Legacy Remediation V1

on:
  push:
    branches: [ops/product-legacy-remediation-v1]

jobs:
  remediation-checkpoint-v10-final-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Compile final checkpoint and discovery
        run: |
          python3 -m py_compile .ops/legacy-product-remediation-audit-v10.py
          python3 -m py_compile .ops/legacy-family-discovery-v1.py
      - name: Audit 41 remediated products
        run: python3 .ops/legacy-product-remediation-audit-v10.py
      - name: Discover final remaining legacy products
        run: python3 .ops/legacy-family-discovery-v1.py
