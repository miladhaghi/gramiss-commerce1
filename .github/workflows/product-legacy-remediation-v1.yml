name: Product Legacy Remediation V1

on:
  push:
    branches: [ops/product-legacy-remediation-v1]

jobs:
  shortdesc-batch1-preflight-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Compile batch 1 scripts
        run: |
          python3 -m py_compile .ops/legacy-shortdesc-batch1-facts.py
          python3 -m py_compile .ops/legacy-shortdesc-batch1-publish.py
      - name: Audit batch 1 verified facts
        run: python3 .ops/legacy-shortdesc-batch1-facts.py
