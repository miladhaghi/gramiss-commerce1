name: Product Legacy Remediation V1

on:
  push:
    branches: [ops/product-legacy-remediation-v1]

jobs:
  remediation-checkpoint-prep-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm publisher is inactive
        run: |
          python3 -m py_compile .ops/legacy-pants-batch4-publish.py
          echo "Mutation publisher disabled; checkpoint preparation only."
