name: SEO GSC Verification Publish Once

on:
  push:
    branches: [ops/seo-content-architecture-v1]

jobs:
  publish-verification-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      GSC_FILENAME: google56305b0bdbca4a50.html
      GSC_CONTENT: "google-site-verification: google56305b0bdbca4a50.html"
    steps:
      - uses: actions/checkout@v4
      - name: Compile and self-test publisher
        run: |
          python3 -m py_compile .ops/gsc-verification-file-publisher-v1.py .ops/gsc-activation-preflight-v1.py
          python3 .ops/gsc-verification-file-publisher-v1.py --self-test
      - name: Preflight crawl and sitemap health
        run: python3 .ops/gsc-activation-preflight-v1.py
      - name: Publish Google verification file
        run: python3 .ops/gsc-verification-file-publisher-v1.py --filename "$GSC_FILENAME" --content "$GSC_CONTENT"
      - name: Reconfirm crawl and sitemap health
        run: python3 .ops/gsc-activation-preflight-v1.py
