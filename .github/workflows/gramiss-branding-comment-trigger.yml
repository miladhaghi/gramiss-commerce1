name: Gramiss Branding Comment Trigger

on:
  issue_comment:
    types: [created]

jobs:
  inspect:
    if: github.event.issue.pull_request && github.event.comment.body == '/inspect-gramiss-brand'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect live Gramiss branding targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, urllib.parse, urllib.request, hashlib
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context()
          def call(fn,params):
              url=f'https://{host}:2083/execute/Fileman/{fn}?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Authorization':f'cpanel {user}:{token}'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: obj=json.loads(r.read().decode('utf-8','replace'))
              result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
              if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
              return result.get('data')
          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else root+'/'+parent
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              return d if isinstance(d,str) else None
          def show(rel, needles):
              t=read(rel)
              print('\nFILE',rel,'BYTES',len(t.encode()) if isinstance(t,str) else -1,'SHA',hashlib.sha256(t.encode()).hexdigest()[:16] if isinstance(t,str) else 'NA')
              if not isinstance(t,str): return
              for needle in needles:
                  pos=[m.start() for m in re.finditer(re.escape(needle),t)]
                  print('NEEDLE',repr(needle),'COUNT',len(pos),'POS',pos[:12])
                  for i in pos[:4]:
                      sn=re.sub(r'\s+',' ',t[max(0,i-420):min(len(t),i+1200)]).strip()
                      print('CTX',repr(needle),'@',i,':',sn[:1800])
          show('header.php',['wordmark','GRAMISS','Gramiss','wp_body_open','wp_head()','GRAMISS_BRAND_HEADER_V1'])
          show('front-page.php',['g1-smart-core','>G<','GRAMISS_SMART_SYMBOL_V1'])
          show('footer.php',['footer-wordmark','GRAMISS','GRAMISS_FOOTER_LOGO_V1'])
          for f in ['assets/css/shop.css','assets/css/shop-premium.css','assets/css/shop-premium-shell.css','assets/css/shop-runtime-final-fix.css','assets/css/shop-sculpted.css']:
              show(f,['shop-intro::before','gramiss-shop-premium-hero__mark','content: "G"','content:"GRAMISS"'])
          try:
              show('assets/css/gramiss-brand-system-v1.css',['GRAMISS_BRAND_SYSTEM_V1'])
          except Exception as e:
              print('NO BRAND CSS',repr(e))
          PY

  deploy:
    if: github.event.issue.pull_request && github.event.comment.body == '/deploy-gramiss-brand'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run guarded Gramiss branding deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          src=Path('.github/workflows/cpanel-branding-site-v1.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          block=src[start:end]
          block=block.replace('\\"','"')
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/gramiss_brand_deploy.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PYEXTRACT
          python3 /tmp/gramiss_brand_deploy.py
