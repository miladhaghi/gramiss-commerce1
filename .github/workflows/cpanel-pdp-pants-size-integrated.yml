name: cPanel Mobile Fix Deploy

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/mobile-fix-script'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Checkout operational script
        uses: actions/checkout@v4
      - name: Deploy and verify mobile fixes
        run: python3 deploy/mobile-fix/deploy.py
