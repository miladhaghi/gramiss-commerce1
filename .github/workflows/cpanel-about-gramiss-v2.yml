name: cPanel About Gramiss V2

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/about-gramiss-v2'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/about-gramiss-v2

      - name: Deploy isolated About Gramiss redesign
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          root=os.environ['THEME_ROOT'].strip('/'); ctx=ssl._create_unverified_context()
          stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())

          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'
              data=urllib.parse.urlencode(params).encode()
              req=urllib.request.Request(url if post else url+'?'+data.decode(), data=data if post else None, method='POST' if post else 'GET')
              req.add_header('Authorization',f'cpanel {user}:{token}')
              if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r:
                  obj=json.loads(r.read().decode('utf-8','replace'))
              result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
              if not isinstance(result,dict) or result.get('status')!=1:
                  raise RuntimeError(str(result))
              return result.get('data')

          def read_live(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else root+'/'+parent
              try:
                  d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              except Exception:
                  return None
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              if isinstance(d,str): return d
              return None

          def save_live(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else root+'/'+parent
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          staged=Path('.ops/about-gramiss-v2')
          payload={
              'page-about-gramiss.php':(staged/'page-about-gramiss.php').read_text(encoding='utf-8'),
              'assets/css/about-gramiss-v2.css':(staged/'about-gramiss-v2.css').read_text(encoding='utf-8'),
          }
          for rel,content in payload.items():
              if 'GRAMISS_ABOUT_V2' not in content:
                  raise SystemExit('ABORT: marker missing from '+rel)

          # Backup only the exact files this change owns. No header, footer, Home or WooCommerce files are touched.
          for rel,content in payload.items():
              before=read_live(rel)
              if before is not None:
                  save_live(rel+'.bak-about-v2-'+stamp,before)
                  print('BACKUP',rel,hashlib.sha256(before.encode()).hexdigest())
              else:
                  print('NEW FILE',rel)
              save_live(rel,content)
              after=read_live(rel)
              if after != content:
                  raise SystemExit('LIVE WRITE MISMATCH: '+rel)
              print('PASS WRITE',rel,hashlib.sha256(content.encode()).hexdigest())

          # Purge LiteSpeed cache through a one-time self-deleting helper.
          purge='gramiss-purge-about-v2-'+stamp+'.php'
          php="<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php'; if(function_exists('do_action')){do_action('litespeed_purge_all');} echo 'OK'; @unlink(__FILE__);"
          call('save_file_content',{'dir':'public_html','file':purge,'content':php,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          req=urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'User-Agent':'GramissAboutDeploy/2','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=90) as r:
              print('PURGE',r.status,r.read().decode('utf-8','replace')[:60])

          # Public verification.
          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GramissAboutVerify/2','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r:
                  return r.status,r.read()

          q='?gramiss_about_v2='+str(int(time.time()))
          st,b=public_get('https://gramiss.ir/about-gramiss/'+q)
          html=b.decode('utf-8','replace')
          checks={
              'about 200':st==200,
              'template marker':'GRAMISS_ABOUT_V2' in html or 'data-gramiss-about="v2"' in html,
              'hero heading':'کمتر حدس بزن' in html and 'بهتر انتخاب کن' in html,
              'principles':'سه اصل ساده' in html and 'انتخاب آگاهانه' in html,
              'smart guide':'راهنما، قبل از فروش' in html,
              'cta':'از چیزی که واقعاً نیاز داری شروع کن' in html,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()):
              raise SystemExit('Public About verification failed')

          st_css,b_css=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/css/about-gramiss-v2.css?v='+stamp)
          if st_css!=200 or b'GRAMISS_ABOUT_V2' not in b_css:
              raise SystemExit('Public About CSS verification failed')
          print('PASS: About CSS public')

          # Sanity-check Home remains available. No Home file is modified by this deployment.
          st_home,b_home=public_get('https://gramiss.ir/?about_sanity='+str(int(time.time())))
          if st_home!=200:
              raise SystemExit('Home sanity check failed')
          print('PASS: Home still 200')
          print('LIVE ABOUT GRAMISS V2 DEPLOYED')
          PY
