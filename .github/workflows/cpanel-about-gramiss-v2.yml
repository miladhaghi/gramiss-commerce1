name: cPanel About Gramiss V3

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/about-gramiss-v2'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/about-gramiss-v2

      - name: Deploy approved About Gramiss V3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          root=os.environ['THEME_ROOT'].strip('/'); ctx=ssl._create_unverified_context()
          stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())

          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'
              data=urllib.parse.urlencode(params).encode()
              req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
              req.add_header('Authorization',f'cpanel {user}:{token}')
              if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r:
                  obj=json.loads(r.read().decode('utf-8','replace'))
              result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
              if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
              return result.get('data')

          def read_live(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else root+'/'+parent
              try: d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              except Exception: return None
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              return d if isinstance(d,str) else None

          def save_live(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else root+'/'+parent
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          staged=Path('.ops/about-gramiss-v2')
          payload={
              'page-about-gramiss.php':(staged/'page-about-gramiss.php').read_text(encoding='utf-8'),
              'assets/css/about-gramiss-v2.css':(staged/'about-gramiss-v2.css').read_text(encoding='utf-8'),
          }
          for rel,content in payload.items():
              if 'GRAMISS_ABOUT_V3' not in content: raise SystemExit('ABORT: V3 marker missing from '+rel)

          for rel,content in payload.items():
              before=read_live(rel)
              if before is not None:
                  save_live(rel+'.bak-about-v3-'+stamp,before)
                  print('BACKUP',rel,hashlib.sha256(before.encode()).hexdigest())
              save_live(rel,content)
              after=read_live(rel)
              if after != content: raise SystemExit('LIVE WRITE MISMATCH: '+rel)
              print('PASS WRITE',rel)

          hero_bytes=(staged/'assets/about-hero-gramiss-logo.webp').read_bytes()
          cta_bytes=(staged/'assets/about-cta-editorial.webp').read_bytes()
          hero=base64.b64encode(hero_bytes).decode()
          cta=base64.b64encode(cta_bytes).decode()
          hero_sha=hashlib.sha256(hero_bytes).hexdigest()
          cta_sha=hashlib.sha256(cta_bytes).hexdigest()
          helper='gramiss-about-assets-'+stamp+'.php'
          php=("<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php';"
               "$d=WP_CONTENT_DIR.'/themes/gramiss-theme-next/assets/images/about';"
               "if(!is_dir($d)){wp_mkdir_p($d);}"
               f"file_put_contents($d.'/about-hero-gramiss-logo.webp',base64_decode('{hero}'));"
               f"file_put_contents($d.'/about-cta-editorial.webp',base64_decode('{cta}'));"
               "echo 'OK|'.hash_file('sha256',$d.'/about-hero-gramiss-logo.webp').'|'.hash_file('sha256',$d.'/about-cta-editorial.webp'); @unlink(__FILE__);")
          call('save_file_content',{'dir':'public_html','file':helper,'content':php,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          req=urllib.request.Request('https://gramiss.ir/'+helper+'?t='+str(int(time.time())),headers={'User-Agent':'GramissAboutDeploy/3.1','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=90) as r:
              helper_out=r.read().decode('utf-8','replace').strip()
              if r.status!=200: raise SystemExit('Asset helper failed')
          parts=helper_out.split('|')
          if len(parts)<3 or parts[-2]!=hero_sha or parts[-1]!=cta_sha:
              raise SystemExit('Asset hash verification failed: '+helper_out[-200:])
          print('PASS SERVER HASH hero',hero_sha)
          print('PASS SERVER HASH cta',cta_sha)

          purge='gramiss-purge-about-v3-'+stamp+'.php'
          php="<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php'; if(function_exists('do_action')){do_action('litespeed_purge_all');} echo 'OK'; @unlink(__FILE__);"
          call('save_file_content',{'dir':'public_html','file':purge,'content':php,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          req=urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'User-Agent':'GramissAboutDeploy/3.1','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=90) as r: print('PURGE',r.status)

          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GramissAboutVerify/3.1','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: return r.status,r.read()

          q='?gramiss_about_v31='+str(int(time.time()))
          st,b=public_get('https://gramiss.ir/about-gramiss/'+q); html=b.decode('utf-8','replace')
          checks={
              'about 200':st==200,
              'template marker':'GRAMISS_ABOUT_V3' in html or 'data-gramiss-about="v3"' in html,
              'hero':'کمتر حدس بزن' in html and 'بهتر انتخاب کن' in html,
              'principles':'سه اصل ساده' in html and 'انتخاب آگاهانه' in html,
              'smart guide':'راهنما، قبل از فروش' in html,
              'cta':'از چیزی که واقعاً نیاز داری شروع کن' in html,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('Public About verification failed')

          st_css,b_css=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/css/about-gramiss-v2.css?v='+stamp)
          if st_css!=200 or b'GRAMISS_ABOUT_V3' not in b_css or b'about-hero-gramiss-logo.webp' not in b_css:
              raise SystemExit('CSS verification failed')
          for name in ('about-hero-gramiss-logo.webp','about-cta-editorial.webp'):
              s,d=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/images/about/'+name+'?v='+stamp)
              if s!=200 or len(d)<5000: raise SystemExit('Image verification failed: '+name)
              print('PASS PUBLIC IMAGE',name,len(d),d[:12])
          st_home,_=public_get('https://gramiss.ir/?about_sanity='+str(int(time.time())))
          if st_home!=200: raise SystemExit('Home sanity check failed')
          print('LIVE ABOUT GRAMISS V3.1 DEPLOYED')
          PY
