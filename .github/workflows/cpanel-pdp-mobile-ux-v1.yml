name: cPanel PDP Mobile UX V1

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/pdp-mobile-ux-v1'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      PUBLIC_ROOT: public_html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/pdp-mobile-ux-v1

      - name: Backup, deploy and verify mobile-only PDP UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          theme=os.environ['THEME_ROOT'].strip('/'); public=os.environ['PUBLIC_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode()
              last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(), data=enc if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r:
                          payload=json.loads(r.read().decode('utf-8','replace'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1:
                          raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 {func}: {exc}')
                      if attempt<5: time.sleep(attempt*3)
              raise last

          def read_at(root, rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else root+'/'+parent
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for key in ('content','file_content','data'):
                      if isinstance(data.get(key),str): return data[key]
              if isinstance(data,str): return data
              raise RuntimeError('Unexpected file response: '+rel)

          def write_at(root, rel, content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else root+'/'+parent
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          src=Path('deploy/pdp-mobile-v1')
          css=(src/'product-mobile-v1.css').read_text(encoding='utf-8')
          js=(src/'product-mobile-v1.js').read_text(encoding='utf-8')
          if 'GRAMISS_PDP_MOBILE_UX_V1' not in css or 'GRAMISS_PDP_MOBILE_UX_V1' not in js:
              raise SystemExit('Candidate marker missing')

          css_sha=hashlib.sha256(css.encode()).hexdigest(); js_sha=hashlib.sha256(js.encode()).hexdigest()
          print('CANDIDATE CSS SHA',css_sha)
          print('CANDIDATE JS SHA',js_sha)

          header=read_at(theme,'header.php')
          start='<!-- GRAMISS PDP MOBILE UX V1 START -->'
          end='<!-- GRAMISS PDP MOBILE UX V1 END -->'
          block=f'''{start}\n<?php if ( function_exists( 'is_product' ) && is_product() ) : ?>\n<link id="gramiss-pdp-mobile-v1-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/product-mobile-v1.css?v=20260827-1' ); ?>">\n<script id="gramiss-pdp-mobile-v1-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/product-mobile-v1.js?v=20260827-1' ); ?>"></script>\n<?php endif; ?>\n{end}'''
          if start in header and end in header:
              header_new=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header:
              header_new=header.replace('</head>',block+'\n</head>',1)
          else:
              raise SystemExit('ABORT: </head> not found; nothing written')

          # Back up the only existing file we modify.
          header_backup='header.php.bak-pdp-mobile-v1-'+stamp
          write_at(theme,header_backup,header)
          print('BACKUP',header_backup)

          # If a previous test left candidate assets behind, preserve them too.
          for rel in ('assets/css/product-mobile-v1.css','assets/js/product-mobile-v1.js'):
              try:
                  old=read_at(theme,rel)
                  write_at(theme,rel+'.bak-'+stamp,old)
                  print('BACKUP',rel+'.bak-'+stamp)
              except Exception:
                  pass

          write_at(theme,'assets/css/product-mobile-v1.css',css)
          write_at(theme,'assets/js/product-mobile-v1.js',js)
          write_at(theme,'header.php',header_new)

          live_header=read_at(theme,'header.php')
          live_css=read_at(theme,'assets/css/product-mobile-v1.css')
          live_js=read_at(theme,'assets/js/product-mobile-v1.js')
          checks={
              'header block once': live_header.count(start)==1 and live_header.count(end)==1,
              'css loader': 'product-mobile-v1.css?v=20260827-1' in live_header,
              'js loader': 'product-mobile-v1.js?v=20260827-1' in live_header,
              'css exact': hashlib.sha256(live_css.encode()).hexdigest()==css_sha,
              'js exact': hashlib.sha256(live_js.encode()).hexdigest()==js_sha,
              'mobile css marker': 'GRAMISS_PDP_MOBILE_UX_V1' in live_css,
              'mobile js marker': 'GRAMISS_PDP_MOBILE_UX_V1' in live_js,
              'desktop guarded': '@media (max-width: 760px)' in live_css and "matchMedia('(max-width: 760px)')" in live_js,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()):
              write_at(theme,'header.php',header)
              raise SystemExit('Live file verification failed; header rolled back')

          # Purge LiteSpeed without leaving an endpoint behind.
          purge='gramiss-purge-pdp-mobile-'+stamp+'.php'
          purge_php="<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php'; if(function_exists('do_action')){do_action('litespeed_purge_all');} echo 'OK'; @unlink(__FILE__);"
          write_at(public,purge,purge_php)
          req=urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'User-Agent':'GramissPDPMobile/1','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=90) as r: print('PURGE',r.status,r.read().decode('utf-8','replace')[:30])

          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GramissPDPMobileVerify/1','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: return r.status,r.headers,r.read()

          nonce=str(int(time.time()))
          st,h,b=public_get('https://gramiss.ir/?p=392&g1_pdp_mobile='+nonce)
          product_html=b.decode('utf-8','replace')
          public_checks={
              'product 200': st==200,
              'css ref': 'product-mobile-v1.css?v=20260827-1' in product_html,
              'js ref': 'product-mobile-v1.js?v=20260827-1' in product_html,
              'product page structure': ('g1-pdp' in product_html or 'g2-pdp' in product_html or 'gramiss-pdp-runtime-v3' in product_html),
              'woo cart': 'single_add_to_cart_button' in product_html or 'form class="cart' in product_html,
          }
          for label,ok in public_checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(public_checks.values()):
              write_at(theme,'header.php',header)
              raise SystemExit('Public PDP verification failed; header rolled back')

          for path,marker,wanted in [
              ('assets/css/product-mobile-v1.css','GRAMISS_PDP_MOBILE_UX_V1',css_sha),
              ('assets/js/product-mobile-v1.js','GRAMISS_PDP_MOBILE_UX_V1',js_sha),
          ]:
              st,h,b=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/'+path+'?v='+nonce)
              got=hashlib.sha256(b).hexdigest()
              ok=st==200 and marker.encode() in b and got==wanted
              print(('PASS' if ok else 'FAIL')+': public '+path+' bytes='+str(len(b))+' sha='+got)
              if not ok:
                  write_at(theme,'header.php',header)
                  raise SystemExit('Public asset verification failed; header rolled back')

          # Home is read-only verification: this deployment must not affect it.
          st,h,b=public_get('https://gramiss.ir/?g1_home_safety='+nonce)
          home=b.decode('utf-8','replace')
          home_ok=st==200 and 'g1-floating-hero' in home and 'data-g1-looks' in home
          print(('PASS' if home_ok else 'FAIL')+': Home/Looks untouched')
          if not home_ok: raise SystemExit('Home safety verification failed')

          print('LIVE PDP MOBILE UX V1 DEPLOYED')
          PY
