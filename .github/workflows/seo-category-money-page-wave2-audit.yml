name: SEO Category Money Page Wave 2 Audit

on:
  push:
    branches: [ops/seo-content-architecture-v1]

jobs:
  readonly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Audit product category money pages after wave 2
        run: python3 .ops/category-money-page-audit-v1.py
      - name: Assert wave 2 target summary
        run: |
          echo "Wave 2 category audit completed; inspect CATEGORY_AUDIT_SUMMARY in job log."
