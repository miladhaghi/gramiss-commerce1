name: SEO Legacy Six Reaudit V1

on:
  push:
    branches: [ops/seo-legacy-six-reaudit-v1]

jobs:
  reaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile re-audit
        run: python3 -m py_compile .ops/seo-legacy-six-reaudit-v1.py
      - name: Run read-only legacy six re-audit
        run: python3 .ops/seo-legacy-six-reaudit-v1.py

  category-drift-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Compile category audit
        run: python3 -m py_compile .ops/category-money-page-audit-v1.py
      - name: Diagnose live category sitemap and money pages read only
        run: python3 .ops/category-money-page-audit-v1.py
