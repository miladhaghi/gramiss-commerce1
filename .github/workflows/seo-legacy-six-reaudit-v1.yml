name: SEO Legacy Six Reaudit V1

on:
  push:
    branches: [ops/seo-legacy-six-reaudit-v1]

jobs:
  legacy-six-final-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile re-audit
        run: python3 -m py_compile .ops/seo-legacy-six-reaudit-v1.py
      - name: Confirm zero legacy blockers read only
        run: python3 .ops/seo-legacy-six-reaudit-v1.py

  category-21-final-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Build audit with verified current sitemap invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.ops/category-money-page-audit-v1.py').read_text()
          replacements={
            "PRODUCT_SHA = '70c4ea579eda29df345086d38a50ad0e681532dd0138f7e7d4d46d541e4526b3'":"PRODUCT_SHA = '05e81da96bcc57927bf8d2b467866a1236e9ea0307e1c3902519136294e805bf'",
            "PCAT_SHA = '75711e43ad0c892716fa2f7615fc9594d2165d71b150a0eab0722f7335f881c4'":"PCAT_SHA = 'e56e71dfe5a97014bb645c3726b916c1883c87eb2e21b5eab8cc4598942c13bf'",
            "len(product_urls) != 47":"len(product_urls) != 49",
            "len(pcat_urls) != 20":"len(pcat_urls) != 21",
            "len(findings) != 20":"len(findings) != 21",
          }
          for old,new in replacements.items():
            if src.count(old)!=1:
              raise SystemExit(f'expected one audit replacement for: {old}')
            src=src.replace(old,new)
          Path('/tmp/category-money-page-audit-current.py').write_text(src)
          PY
          python3 -m py_compile /tmp/category-money-page-audit-current.py
      - name: Assert all 21 category money pages pass
        run: |
          python3 /tmp/category-money-page-audit-current.py | tee /tmp/category21.log
          grep -F 'CATEGORY_AUDIT_SUMMARY {"P0": 0, "P1": 0, "P2": 0, "PASS": 21, "total": 21}' /tmp/category21.log
          grep -F 'SAFETY_ERRORS []' /tmp/category21.log
          grep -F 'PASS CATEGORY MONEY PAGE AUDIT V1 READ ONLY' /tmp/category21.log
