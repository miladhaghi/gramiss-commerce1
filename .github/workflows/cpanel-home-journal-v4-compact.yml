name: cPanel Home Journal V4 Compact

on:
  push:
    branches: [main]
    paths:
      - 'ops/home-journal-v4-trigger.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Compact Home Journal live section
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/journal_v4.py
          python3 /tmp/journal_v4.py
