name: cPanel Shop Alignment Fix

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/shop-alignment-fix'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wordpress-migration
      - name: Deploy Shop alignment fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(fn,p,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(p).encode(); last=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post:req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=45) as r: payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result.get('errors') if isinstance(result,dict) else result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/3 {fn}: {exc}')
                      if attempt<3: time.sleep(attempt*2)
              raise last

          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for key in ('content','file_content','data'):
                      if isinstance(data.get(key),str): return data[key]
              if isinstance(data,str): return data
              raise RuntimeError(rel)

          def save(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          css=Path('wordpress/gramiss-theme/assets/css/shop-alignment-fix.css').read_text(encoding='utf-8')
          if 'GRAMISS_SHOP_ALIGNMENT_FIX_V1' not in css or 'margin-inline-end:auto' not in css or 'justify-content:center' not in css:
              raise SystemExit('Alignment fix source markers missing')

          header=read('header.php')
          save(f'header.php.bak-shop-align-{stamp}',header)
          try:
              old=read('assets/css/shop-alignment-fix.css'); save(f'assets/css/shop-alignment-fix.css.bak-{stamp}',old)
          except Exception:
              pass
          save('assets/css/shop-alignment-fix.css',css)

          start='<!-- GRAMISS SHOP ALIGNMENT FIX START -->'; end='<!-- GRAMISS SHOP ALIGNMENT FIX END -->'
          block=start+'\n<link id="gramiss-shop-alignment-fix-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . \'/assets/css/shop-alignment-fix.css?v=20260820-1\' ); ?>">\n'+end
          if start in header and end in header:
              header_new=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header:
              header_new=header.replace('</head>',block+'\n</head>',1)
          else:
              raise SystemExit('No </head> marker in live header')
          save('header.php',header_new)

          liveh=read('header.php'); livecss=read('assets/css/shop-alignment-fix.css')
          checks={
              'loader':'shop-alignment-fix.css?v=20260820-1' in liveh,
              'hero right anchor':'margin-inline-end:auto' in livecss and 'margin:0!important' in livecss,
              'sort centering':'display:inline-flex!important' in livecss and 'justify-content:center!important' in livecss and 'align-items:center!important' in livecss,
              'no card sizing':'.gse-media-frame' not in livecss and 'ul.products' not in livecss,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if not all(checks.values()): raise SystemExit('Live alignment verification failed')

          url='https://gramiss.ir/?'+urllib.parse.urlencode({'post_type':'product','_gramiss_align_fix':stamp})
          req=urllib.request.Request(url,headers={'User-Agent':'GramissDeployCheck/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=45) as r: html=r.read().decode('utf-8','replace'); status=r.status
          print('Shop HTTP status:',status)
          if status!=200 or 'shop-alignment-fix.css?v=20260820-1' not in html: raise SystemExit('Live HTML verification failed')
          print('LIVE SHOP ALIGNMENT FIX DEPLOYED')
          PY
