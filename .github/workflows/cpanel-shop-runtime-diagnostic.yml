name: cPanel Shop Runtime Diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    if: github.head_ref == 'ops/shop-runtime-diagnostic'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Inspect live Shop runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, urllib.parse, urllib.request
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/'); ctx=ssl._create_unverified_context()
          def call(fn,p):
              u=f'https://{host}:2083/execute/Fileman/{fn}?'+urllib.parse.urlencode(p); q=urllib.request.Request(u); q.add_header('Authorization',f'cpanel {user}:{token}')
              with urllib.request.urlopen(q,context=ctx,timeout=45) as r: x=json.loads(r.read().decode())
              y=x.get('result') if isinstance(x.get('result'),dict) else x
              if not isinstance(y,dict) or y.get('status')!=1: raise RuntimeError(y)
              return y.get('data')
          def read(rel):
              p,n=rel.rsplit('/',1); d=f'{root}/{p}'; x=call('get_file_content',{'dir':d,'file':n,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(x,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(x.get(k),str): return x[k]
              return x if isinstance(x,str) else ''
          for rel in ['assets/js/shop-category-nav.js','assets/css/shop-category-nav.css']:
              print('===',rel,'===')
              t=read(rel)
              for i,l in enumerate(t.splitlines(),1):
                  if 'gramiss-shop-cleaning' in l or 'remove' in l.lower() or '#content' in l or '#primary' in l: print(f'{i}: {l[:1800]}')
          PY
