name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  litespeed-cache-purge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile guarded cache purge
        run: python3 -m py_compile .ops/performance-litespeed-cache-purge-v1.py
      - name: Purge LiteSpeed cache and verify fresh archive HTML
        run: python3 .ops/performance-litespeed-cache-purge-v1.py
