name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  inspect-related-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - name: Read live header related-product renderer
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.parse, urllib.request
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          params=urllib.parse.urlencode({
            'dir':'public_html/wp-content/themes/gramiss-theme-next',
            'file':'header.php','from_charset':'_DETECT_','to_charset':'utf-8'
          })
          req=urllib.request.Request(f'https://{host}:2083/execute/Fileman/get_file_content?{params}')
          req.add_header('Authorization',f'cpanel {user}:{token}')
          with urllib.request.urlopen(req,context=ssl._create_unverified_context(),timeout=90) as r:
            payload=json.loads(r.read().decode('utf-8','replace'))
          data=payload.get('result',{}).get('data','')
          if isinstance(data,dict):
            text=data.get('content') or data.get('file_content') or data.get('data') or ''
          else: text=data
          needles=['GRAMISS PDP RELATED SCULPTED START','single_product_archive_thumbnail_size','get_image(\'full\'','get_image( \'full\'','woocommerce_related_products','woocommerce_before_shop_loop_item_title','attachment-full','related.products']
          for needle in needles:
            pos=0; found=0
            while True:
              pos=text.find(needle,pos)
              if pos<0: break
              found+=1
              a=max(0,pos-1600); b=min(len(text),pos+2600)
              print(f'\n=== NEEDLE {needle!r} MATCH {found} AT {pos} ===\n{text[a:b]}\n=== END ===')
              pos += len(needle)
              if found>=5: break
          print('HEADER_BYTES',len(text.encode('utf-8')))
          PY
