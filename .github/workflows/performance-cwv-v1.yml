name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  cache-variant-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile cache probe
        run: python3 -m py_compile .ops/performance-cache-variant-probe-v1.py
      - name: Probe archive cache variants
        run: python3 .ops/performance-cache-variant-probe-v1.py
