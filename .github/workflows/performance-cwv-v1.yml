name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  pdp-after-v13-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile PDP Lighthouse audit
        run: python3 -m py_compile .ops/performance-pdp-after-v1.py
      - name: Confirm Lighthouse
        run: npx -y lighthouse@12.2.1 --version
      - name: Measure live PDP after v1-3 retirement
        env:
          PERF_OUT: /tmp/gramiss-pdp-after-v2
        run: python3 .ops/performance-pdp-after-v1.py
      - name: Upload PDP reports after v1-3 retirement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gramiss-pdp-performance-after-v2
          path: /tmp/gramiss-pdp-after-v2
          if-no-files-found: warn
          retention-days: 14
