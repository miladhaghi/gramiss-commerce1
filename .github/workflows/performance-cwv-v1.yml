name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  lighthouse-baseline-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compile and self-test baseline tool
        run: |
          python3 -m py_compile .ops/performance-baseline-v1.py
          python3 .ops/performance-baseline-v1.py --self-test

      - name: Confirm browser and Lighthouse
        run: |
          google-chrome --version || chromium --version || chromium-browser --version
          node --version
          npm --version
          npx -y lighthouse@12.2.1 --version

      - name: Run production Lighthouse baseline
        env:
          PERF_REPEATS: "2"
          PERF_OUT: /tmp/gramiss-perf
        run: python3 .ops/performance-baseline-v1.py --run

      - name: Upload raw Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gramiss-performance-baseline-v1
          path: /tmp/gramiss-perf
          if-no-files-found: warn
          retention-days: 14
