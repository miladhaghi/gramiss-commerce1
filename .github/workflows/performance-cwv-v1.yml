name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  pdp-postfix-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile post-fix PDP audit
        run: python3 -m py_compile .ops/performance-pdp-after-v1.py
      - name: Confirm Lighthouse
        run: npx -y lighthouse@12.2.1 --version
      - name: Run post-fix PDP Lighthouse
        env:
          PERF_OUT: /tmp/gramiss-pdp-after
        run: python3 .ops/performance-pdp-after-v1.py
      - name: Upload post-fix PDP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gramiss-pdp-performance-after-v1
          path: /tmp/gramiss-pdp-after
          if-no-files-found: warn
          retention-days: 14
