name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  apply-pdp-image-request-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile safe PDP image request fix
        run: python3 -m py_compile .ops/performance-pdp-image-request-fix-v3.py
      - name: Apply safe PDP image request fix
        run: python3 .ops/performance-pdp-image-request-fix-v3.py
