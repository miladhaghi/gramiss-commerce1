name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  pdp-mobile-runtime-scan-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile expanded PDP runtime scan
        run: python3 -m py_compile .ops/performance-pdp-runtime-loader-scan-v2.py
      - name: Inspect live PDP mobile runtimes read only
        run: python3 .ops/performance-pdp-runtime-loader-scan-v2.py
