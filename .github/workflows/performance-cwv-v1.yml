name: Performance CWV V1

on:
  push:
    branches: [ops/performance-cwv-v1]

jobs:
  retire-pdp-style-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile guarded v1-3 retirement
        run: python3 -m py_compile .ops/performance-retire-pdp-style-v13-v1.py
      - name: Retire duplicate PDP style v1-3 runtime
        run: python3 .ops/performance-retire-pdp-style-v13-v1.py
