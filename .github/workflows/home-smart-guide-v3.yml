name: Home Smart Guide V3

on:
  push:
    branches: [ops/home-smart-guide-v3]

jobs:
  deploy-smart-guide-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile guarded Smart Guide V3 deploy
        run: python3 -m py_compile .ops/home-smart-guide-deploy-v3.py
      - name: Deploy Smart Guide V3 with rollback guards
        run: python3 .ops/home-smart-guide-deploy-v3.py
