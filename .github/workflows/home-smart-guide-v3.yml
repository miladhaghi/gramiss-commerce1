name: Home Smart Guide V3

on:
  push:
    branches: [ops/home-smart-guide-v3]

jobs:
  verify-smart-guide-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile Smart Guide V3 verifier
        run: python3 -m py_compile .ops/home-smart-guide-inspect-v3.py
      - name: Verify live Smart Guide V3 read only
        run: python3 .ops/home-smart-guide-inspect-v3.py
