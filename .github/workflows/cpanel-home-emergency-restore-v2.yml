name: cPanel Home Emergency Restore v2

on:
  pull_request:
    branches: [main]

jobs:
  restore:
    if: github.head_ref == 'ops/home-emergency-restore'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Restore exact pre-Looks front page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,ssl,time,urllib.parse,urllib.request
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); backup='front-page.php.bak-home-looks-20260825-193543'
          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post:req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r: obj=json.loads(r.read().decode('utf-8','replace'))
                      result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as e:
                      last=e; print(f'Attempt {attempt}/5 {fn}: {e}')
                      if attempt<5:time.sleep(attempt*3)
              raise last
          def read(name):
              d=call('get_file_content',{'dir':root,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str):return d[k]
              if isinstance(d,str):return d
              raise RuntimeError('Unexpected content for '+name)
          def save(name,content):call('save_file_content',{'dir':root,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          pre=read(backup); current=read('front-page.php')
          print('backup bytes',len(pre.encode()),'sha',hashlib.sha256(pre.encode()).hexdigest())
          print('current bytes',len(current.encode()),'sha',hashlib.sha256(current.encode()).hexdigest())
          if not pre.strip().startswith('<?php'):raise SystemExit('Backup is not PHP')
          if 'data-g1-looks' in pre:raise SystemExit('Backup unexpectedly contains Looks')
          save('front-page.php.bak-before-emergency-v2-'+time.strftime('%Y%m%d-%H%M%S',time.gmtime()),current)
          save('front-page.php',pre)
          restored=read('front-page.php')
          if restored!=pre:raise SystemExit('Restore mismatch')
          req=urllib.request.Request('https://gramiss.ir/?restore_verify='+str(int(time.time())),headers={'User-Agent':'GramissRestoreVerify/2','Cache-Control':'no-cache','Pragma':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=90) as r: html=r.read().decode('utf-8','replace'); status=r.status
          print('home status',status,'looks marker',('data-g1-looks' in html))
          if status!=200 or 'data-g1-looks' in html:raise SystemExit('Public restore verification failed')
          print('LIVE HOME RESTORED EXACTLY TO PRE-LOOKS BACKUP')
          PY
