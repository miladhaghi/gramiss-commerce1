name: cPanel PDP v1.3.1 Verify Repair

on:
  pull_request:
    branches: [main]

jobs:
  verify-repair:
    if: github.head_ref == 'fix/pdp-live-direct'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Verify or repair live PDP root layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())
          def call(func,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'; enc=urllib.parse.urlencode(params).encode()
              req=urllib.request.Request(url if post else url+'?'+enc.decode(),data=enc if post else None,method='POST' if post else 'GET')
              req.add_header('Authorization',f'cpanel {user}:{token}')
              if post:req.add_header('Content-Type','application/x-www-form-urlencoded')
              with urllib.request.urlopen(req,context=ctx,timeout=45) as r:p=json.loads(r.read().decode())
              result=p.get('result') if isinstance(p.get('result'),dict) else p
              if not isinstance(result,dict) or result.get('status')!=1:raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
              return result.get('data')
          def get_file(rel):
              parent,name=rel.rsplit('/',1); data=call('get_file_content',{'dir':f'{root}/{parent}','file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str):return data[k]
              if isinstance(data,str):return data
              raise RuntimeError('Unexpected content response')
          def save_file(rel,content):
              parent,name=rel.rsplit('/',1); call('save_file_content',{'dir':f'{root}/{parent}','file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)
          rel='assets/css/product-detail.css'; css=get_file(rel); marker='/* Gramiss PDP root layout override v1.3.1 */'
          override=r'''/* Gramiss PDP root layout override v1.3.1 */
body.single-product .g1-product-page div.product.g1-pdp-product{display:block!important;grid-template-columns:none!important;grid-template-rows:none!important;column-gap:0!important;row-gap:0!important;align-items:initial!important;width:100%!important;max-width:none!important;float:none!important;position:relative!important;overflow:visible!important}
body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-main{display:grid!important;grid-template-columns:minmax(330px,.82fr) minmax(0,1.18fr)!important;grid-template-rows:auto!important;column-gap:clamp(26px,3.6vw,58px)!important;align-items:start!important;width:100%!important;min-width:0!important;direction:ltr!important;position:relative!important;z-index:1!important}
body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-main>.g1-pdp-summary{grid-column:1!important;grid-row:1!important;width:100%!important;min-width:0!important;float:none!important;position:static!important;inset:auto!important;margin:0!important;direction:rtl!important}
body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-main>.g1-pdp-gallery-col{grid-column:2!important;grid-row:1!important;width:100%!important;min-width:0!important;float:none!important;position:relative!important}
body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-after{display:block!important;grid-column:auto!important;grid-row:auto!important;width:100%!important;max-width:none!important;min-width:0!important;clear:both!important;float:none!important;position:relative!important;inset:auto!important;z-index:0!important;margin:clamp(72px,8vw,112px) 0 0!important;padding:0!important;overflow:visible!important}
body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-after>.woocommerce-tabs,body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-after>.up-sells,body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-after>.upsells,body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-after>.related.products{display:block!important;width:100%!important;max-width:none!important;min-width:0!important;clear:both!important;float:none!important;position:static!important;inset:auto!important;transform:none!important}
body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col div.images.woocommerce-product-gallery{display:grid!important;grid-template-columns:minmax(0,1fr) 92px!important;grid-template-rows:auto!important;column-gap:14px!important;width:100%!important;float:none!important;margin:0!important;padding:14px!important;background:#fff!important;border:0!important;box-shadow:none!important;direction:ltr!important}
body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col div.images.woocommerce-product-gallery>.flex-viewport,body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col div.images.woocommerce-product-gallery>.woocommerce-product-gallery__wrapper{grid-column:1!important;grid-row:1!important;min-width:0!important;width:100%!important;background:#fff!important}
body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col div.images.woocommerce-product-gallery>.flex-control-thumbs{grid-column:2!important;grid-row:1!important;display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;gap:10px!important;width:92px!important;max-width:92px!important;margin:0!important;padding:0!important;float:none!important;overflow-x:hidden!important;overflow-y:auto!important}
body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col .flex-control-thumbs li{display:block!important;flex:0 0 84px!important;width:84px!important;height:84px!important;margin:0!important;float:none!important}
body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col .flex-control-thumbs li img{width:84px!important;height:84px!important;object-fit:contain!important;background:#fff!important}
@media(max-width:760px){body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-main{display:flex!important;flex-direction:column!important;gap:22px!important;direction:rtl!important}body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-main>.g1-pdp-gallery-col,body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-main>.g1-pdp-summary{width:100%!important;min-width:0!important}body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col div.images.woocommerce-product-gallery{display:block!important;width:100%!important;padding:10px!important;background:#fff!important;direction:rtl!important}body.single-product .g1-product-page div.product.g1-pdp-product .g1-pdp-gallery-col div.images.woocommerce-product-gallery>.flex-control-thumbs{display:flex!important;flex-direction:row!important;gap:8px!important;width:100%!important;max-width:none!important;margin:10px 0 0!important;overflow-x:auto!important;overflow-y:hidden!important}body.single-product .g1-product-page div.product.g1-pdp-product>.g1-pdp-after{margin-top:56px!important}}
'''
          base=css.split(marker,1)[0].rstrip() if marker in css else css.rstrip()
          desired=base+'\n\n'+override+'\n'
          if css!=desired:
              save_file(f'assets/css/product-detail.css.bak-{stamp}',css); save_file(rel,desired); print('REPAIRED LIVE CSS')
          live=get_file(rel)
          checks={'marker':marker in live,'root block':'div.product.g1-pdp-product{display:block!important' in live,'grid disabled':'grid-template-columns:none!important' in live,'after sequential':'>.g1-pdp-after{display:block!important' in live,'thumb rail':'>.flex-control-thumbs{grid-column:2!important' in live}
          for k,v in checks.items():print(('PASS' if v else 'FAIL')+': '+k)
          if not all(checks.values()):raise SystemExit('Live PDP v1.3.1 verification failed')
          print('LIVE PDP v1.3.1 VERIFIED')
          PY
