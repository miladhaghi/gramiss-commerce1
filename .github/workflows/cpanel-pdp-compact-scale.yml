name: cPanel PDP Compact Scale

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/pdp-compact-scale'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      PUBLIC_ROOT: public_html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wordpress-migration

      - name: Deploy compact PDP desktop scale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          root=os.environ['THEME_ROOT'].strip('/'); public=os.environ['PUBLIC_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())

          def call(func,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(),data=enc if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r: payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc
                      if attempt<5: time.sleep(attempt*3)
              raise last

          def read(base,rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=base if not parent else f'{base}/{parent}'
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              return d if isinstance(d,str) else ''

          def save(base,rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=base if not parent else f'{base}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          css=Path('deploy/pdp-premium/product-runtime-compact-scale.css').read_text(encoding='utf-8')
          header=read(root,'header.php')
          save(root,f'header.php.bak-pdpcompact-{stamp}',header)
          save(root,'assets/css/product-runtime-compact-scale.css',css)

          start='<!-- GRAMISS PDP COMPACT SCALE START -->'; end='<!-- GRAMISS PDP COMPACT SCALE END -->'
          block=f'''{start}\n<link id="gramiss-pdp-compact-scale-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/product-runtime-compact-scale.css?v=20260826-1' ); ?>">\n{end}'''
          if start in header and end in header:
              before=header.split(start,1)[0]; after=header.split(end,1)[1]; header=before+block+after
          else:
              premium_end='<!-- GRAMISS PDP PREMIUM V1 END -->'
              if premium_end in header:
                  idx=header.find(premium_end)+len(premium_end)
                  header=header[:idx]+'\n'+block+header[idx:]
              else:
                  anchor='<script id="gramiss-pdp-gallery-switch-js" defer'
                  idx=header.find(anchor)
                  if idx<0: raise SystemExit('PDP insertion anchor not found')
                  header=header[:idx]+block+'\n'+header[idx:]
          save(root,'header.php',header)

          live_css=read(root,'assets/css/product-runtime-compact-scale.css'); live_header=read(root,'header.php')
          assert 'GRAMISS_PDP_COMPACT_SCALE_V1' in live_css
          assert 'gramiss-pdp-compact-scale-css' in live_header
          assert 'product-runtime-compact-scale.css?v=20260826-1' in live_header
          print('PASS live compact scale files')

          purge=f'gramiss-pdp-compact-purge-{int(time.time())}.php'
          php="""<?php\nheader('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');\nheader('X-LiteSpeed-Purge: public,*');\ndefine('WP_USE_THEMES', false); require __DIR__ . '/wp-load.php';\nif (function_exists('do_action')) { do_action('litespeed_purge_all'); do_action('litespeed_purge_front'); }\necho 'GRAMISS_PDP_COMPACT_PURGED'; @unlink(__FILE__);\n"""
          save(public,purge,php)
          req=urllib.request.Request(f'https://gramiss.ir/{purge}',headers={'User-Agent':'GramissPDPCompact/1'})
          with urllib.request.urlopen(req,context=ctx,timeout=60) as r: body=r.read().decode('utf-8','replace')
          assert 'GRAMISS_PDP_COMPACT_PURGED' in body
          time.sleep(3)

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GramissPDPCompactVerify/1','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=75) as r: return r.status,r.headers,r.read().decode('utf-8','replace')

          for slug in ['پیراهن-آستین-بلند-پارچه-سیلک','کتونی-سبک-ونس-سفید']:
              url='https://gramiss.ir/?'+urllib.parse.urlencode({'product':slug})
              for n in (1,2):
                  status,headers,html=get(url)
                  ok='product-runtime-compact-scale.css?v=20260826-1' in html
                  print(slug,n,status,headers.get('X-LiteSpeed-Cache'),ok)
                  assert status==200 and ok
                  time.sleep(1)

          status,_,served=get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/css/product-runtime-compact-scale.css?v=20260826-1')
          assert status==200 and 'GRAMISS_PDP_COMPACT_SCALE_V1' in served and 'height:clamp(430px,57svh,540px)' in served
          print('SUCCESS: COMPACT PREMIUM PDP SCALE LIVE AND VERIFIED')
          PY
