name: Test cPanel UAPI Read Access

on:
  push:
    branches:
      - test/cpanel-uapi
  pull_request:
    branches:
      - main

jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      THEME_DIR: public_html/wp-content/themes/gramiss-theme-next
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          if [ -z "${CPANEL_TOKEN}" ]; then
            echo "CPANEL_TOKEN secret is missing"
            exit 1
          fi
          echo "CPANEL_TOKEN secret is present"

      - name: Diagnose cPanel API authentication safely
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -k -sS \
            -o /tmp/cpanel-auth.json \
            -w '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Variables/get_user_information")

          echo "Auth HTTP status: ${HTTP_CODE}"
          python3 - <<'PY'
          import json, sys
          p = json.load(open('/tmp/cpanel-auth.json', encoding='utf-8'))
          print('Top-level keys:', ', '.join(sorted(p.keys())))

          if isinstance(p.get('result'), dict):
              r = p['result']
              print('UAPI result status:', r.get('status'))
              for key in ('errors', 'messages', 'warnings'):
                  vals = r.get(key) or []
                  if isinstance(vals, str):
                      vals = [vals]
                  for value in vals[:3]:
                      print(f'{key}: {value}')
              if r.get('status') == 1:
                  print('Authentication succeeded in UAPI format')
                  sys.exit(0)

          if isinstance(p.get('cpanelresult'), dict):
              cr = p['cpanelresult']
              print('cPanelResult keys:', ', '.join(sorted(cr.keys())))
              data = cr.get('data') or []
              if isinstance(data, list):
                  for item in data[:3]:
                      if isinstance(item, dict):
                          for key in ('result', 'reason', 'error', 'status'):
                              if key in item:
                                  print(f'cpanelresult.{key}: {item[key]}')

          for key in ('status', 'message', 'reason', 'error', 'errors'):
              if key in p:
                  value = p[key]
                  if isinstance(value, (str, int, float, bool)) or value is None:
                      print(f'top-level {key}: {value}')
                  elif isinstance(value, list):
                      print(f'top-level {key}: {value[:3]}')

          print('Authentication did not return a successful UAPI result')
          sys.exit(1)
          PY

      - name: Read active theme directory via cPanel UAPI
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -k -sS \
            -o /tmp/cpanel-files.json \
            -w '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --get \
            --data-urlencode "dir=${THEME_DIR}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/list_files")

          echo "Fileman HTTP status: ${HTTP_CODE}"
          python3 - <<'PY'
          import json, sys
          p = json.load(open('/tmp/cpanel-files.json', encoding='utf-8'))
          r = p.get('result', {})
          print(f"Fileman UAPI status: {r.get('status')}")
          for key in ('errors', 'messages', 'warnings'):
              vals = r.get(key) or []
              if isinstance(vals, str):
                  vals = [vals]
              for value in vals[:3]:
                  print(f'{key}: {value}')
          if r.get('status') != 1:
              sys.exit(1)
          data = r.get('data') or []
          print(f'Authenticated theme read succeeded. Entries found: {len(data)}')
          for item in data[:15]:
              if not isinstance(item, dict):
                  continue
              name = item.get('file') or item.get('name') or item.get('fullpath') or '<unnamed>'
              kind = item.get('type') or ('dir' if item.get('isdir') else 'file')
              print(f'- {name} [{kind}]')
          PY
