name: cPanel Home Looks Visual Polish V1

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/home-looks-visual-polish-deploy-v1'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      LOOK1_SHA: 332df1376ad3ebeb448a34a800fb9fbc66bb8f989ed97fb9db46e7877d3ea586
      LOOK2_SHA: 352c180eb7c2da91dda2b3f6993c172a9ac7d15485d90c2676135380a6d3381d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/home-looks-visual-polish-deploy-v1

      - name: Deploy only approved Home Looks visual polish files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          expected1=os.environ['LOOK1_SHA']; expected2=os.environ['LOOK2_SHA']
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())

          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GramissLooksPolish/1','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: return r.status,r.read()

          st,b=public_get('https://gramiss.ir/?looks_polish_pre='+str(int(time.time())))
          html=b.decode('utf-8','replace')
          pre={
              'home 200':st==200,
              'hero':'g1-floating-hero' in html,
              'signal':'g1-signal-strip' in html,
              'looks':'data-g1-looks' in html,
              'collections':'id="collections"' in html,
              'order':html.find('g1-signal-strip') < html.find('data-g1-looks') < html.find('id="collections"'),
          }
          for label,ok in pre.items(): print(('PASS' if ok else 'FAIL')+': preflight '+label)
          if not all(pre.values()): raise SystemExit('ABORT: live Home structure changed; nothing written')

          src=Path('.ops/home-looks/visual-polish')
          partial=(src/'home-looks.php').read_bytes()
          look1=(src/'gramiss-look-01.webp').read_bytes()
          look2=(src/'gramiss-look-02.webp').read_bytes()
          if b'GRAMISS_HOME_LOOKS_SURGICAL_V2' not in partial or b'v=2.1.0' not in partial: raise SystemExit('ABORT: candidate partial marker/version missing')
          if not (look1.startswith(b'RIFF') and b'WEBP' in look1[:16]): raise SystemExit('ABORT: Look 01 invalid')
          if not (look2.startswith(b'RIFF') and b'WEBP' in look2[:16]): raise SystemExit('ABORT: Look 02 invalid')
          sha1=hashlib.sha256(look1).hexdigest(); sha2=hashlib.sha256(look2).hexdigest()
          print('Look01',len(look1),sha1); print('Look02',len(look2),sha2)
          if sha1!=expected1 or sha2!=expected2: raise SystemExit('ABORT: candidate image hash mismatch')

          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=90) as r: obj=json.loads(r.read().decode('utf-8','replace'))
                      result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 {fn}: {exc}')
                      if attempt<5: time.sleep(attempt*3)
              raise last

          payload={
              'template-parts/home-looks.php':base64.b64encode(partial).decode(),
              'assets/images/home/gramiss-look-01.webp':base64.b64encode(look1).decode(),
              'assets/images/home/gramiss-look-02.webp':base64.b64encode(look2).decode(),
          }
          expected={rel:hashlib.sha256(base64.b64decode(enc)).hexdigest() for rel,enc in payload.items()}
          payload64=base64.b64encode(json.dumps(payload,separators=(',',':')).encode()).decode()
          expected64=base64.b64encode(json.dumps(expected,separators=(',',':')).encode()).decode()
          nonce=hashlib.sha256((stamp+expected1+expected2).encode()).hexdigest()
          name='gramiss-looks-polish-'+stamp+'.php'
          installer=f'''<?php
          ini_set('display_errors','0'); header('Content-Type: application/json; charset=utf-8');
          if (!isset($_GET['k']) || !hash_equals('{nonce}',(string)$_GET['k'])) {{ http_response_code(403); echo '{{"ok":false}}'; exit; }}
          $theme=__DIR__.'/wp-content/themes/gramiss-theme-next'; $payload=json_decode(base64_decode('{payload64}'),true); $expected=json_decode(base64_decode('{expected64}'),true); $out=array();
          foreach($payload as $rel=>$encoded) {{ $target=$theme.'/'.$rel; $bytes=base64_decode($encoded,true); if($bytes===false) throw new Exception('decode '.$rel); if(file_exists($target)) {{ $bak=$target.'.bak-visual-polish-{stamp}'; if(!@copy($target,$bak)) throw new Exception('backup '.$rel); }} else {{ $bak=null; }} $tmp=$target.'.tmp-{stamp}'; if(file_put_contents($tmp,$bytes,LOCK_EX)===false) throw new Exception('write '.$rel); if(!hash_equals($expected[$rel],hash_file('sha256',$tmp))) {{ @unlink($tmp); throw new Exception('hash '.$rel); }} if(!@rename($tmp,$target)) {{ @unlink($tmp); throw new Exception('rename '.$rel); }} $out[$rel]=array('sha256'=>hash_file('sha256',$target),'bytes'=>filesize($target),'backup'=>$bak); }}
          @unlink(__FILE__); echo json_encode(array('ok'=>true,'files'=>$out)); ?>'''
          call('save_file_content',{'dir':'public_html','file':name,'content':installer,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          req=urllib.request.Request('https://gramiss.ir/'+name+'?k='+urllib.parse.quote(nonce)+'&t='+str(int(time.time())),headers={'User-Agent':'GramissLooksPolish/1','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=120) as r: result=json.loads(r.read().decode('utf-8','replace'))
          if not result.get('ok'): raise SystemExit('Installer failed')
          for rel,sha in expected.items():
              meta=(result.get('files') or {}).get(rel) or {}
              if meta.get('sha256')!=sha: raise SystemExit('Live hash mismatch: '+rel)
              print('PASS deployed',rel,'bytes',meta.get('bytes'),'sha',meta.get('sha256'),'backup',meta.get('backup'))

          purge='gramiss-purge-looks-polish-'+stamp+'.php'
          php="<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php'; if(function_exists('do_action')){do_action('litespeed_purge_all');} echo 'OK'; @unlink(__FILE__);"
          call('save_file_content',{'dir':'public_html','file':purge,'content':php,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          with urllib.request.urlopen(urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'User-Agent':'GramissLooksPolish/1'}),context=ctx,timeout=90) as r: print('PURGE',r.status,r.read().decode()[:50])

          st,b=public_get('https://gramiss.ir/?looks_polish_post='+str(int(time.time())))
          html=b.decode('utf-8','replace')
          post={
              'home 200':st==200,
              'hero preserved':'g1-floating-hero' in html,
              'signal preserved':'g1-signal-strip' in html,
              'looks exists':'data-g1-looks' in html,
              'collections preserved':'id="collections"' in html,
              'order correct':html.find('g1-signal-strip') < html.find('data-g1-looks') < html.find('id="collections"'),
              'single looks':html.count('data-g1-looks')==1,
              'new image version':'gramiss-look-01.webp?v=2.1.0' in html and 'gramiss-look-02.webp?v=2.1.0' in html,
          }
          for label,ok in post.items(): print(('PASS' if ok else 'FAIL')+': post '+label)
          if not all(post.values()): raise SystemExit('Public Home verification failed')

          for path,sha in [('assets/images/home/gramiss-look-01.webp',expected1),('assets/images/home/gramiss-look-02.webp',expected2)]:
              st,b=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/'+path+'?verify='+stamp)
              got=hashlib.sha256(b).hexdigest(); ok=st==200 and got==sha
              print(('PASS' if ok else 'FAIL')+': public '+path+' HTTP='+str(st)+' bytes='+str(len(b))+' sha='+got)
              if not ok: raise SystemExit('Public asset verification failed: '+path)

          print('LIVE HOME LOOKS VISUAL POLISH V1 DEPLOYED — HERO/ORDER PRESERVED')
          PY
