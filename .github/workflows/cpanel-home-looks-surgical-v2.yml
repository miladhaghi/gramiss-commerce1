name: cPanel Home Looks Mobile CSS Cache Bust V1

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/home-looks-mobile-cache-bust-v1'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Bust mobile Home Looks CSS cache only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, ssl, time, urllib.parse, urllib.request

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())

          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=90) as r: obj=json.loads(r.read().decode('utf-8','replace'))
                      result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 {fn}: {exc}')
                      if attempt<5: time.sleep(attempt*3)
              raise last

          def read_live(rel):
              parent,name=rel.rsplit('/',1); directory=root+'/'+parent
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              if isinstance(d,str): return d
              raise RuntimeError('Unexpected live content: '+rel)

          def save_live(rel,content):
              parent,name=rel.rsplit('/',1); directory=root+'/'+parent
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GramissLooksMobileCacheBust/1','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: return r.status,r.read()

          st,b=public_get('https://gramiss.ir/?mobile_cache_pre='+str(int(time.time())))
          html=b.decode('utf-8','replace')
          pre={'home 200':st==200,'hero':'g1-floating-hero' in html,'looks':'data-g1-looks' in html,'collections':'id="collections"' in html,'order':html.find('g1-signal-strip') < html.find('data-g1-looks') < html.find('id="collections"')}
          for label,ok in pre.items(): print(('PASS' if ok else 'FAIL')+': preflight '+label)
          if not all(pre.values()): raise SystemExit('ABORT: live structure changed')

          css=read_live('assets/css/home-looks.css')
          if 'GRAMISS_HOME_LOOKS_MOBILE_CARD_FIX_V1' not in css: raise SystemExit('ABORT: mobile card fix CSS is not live')

          rel='template-parts/home-looks.php'; partial=read_live(rel)
          if 'GRAMISS_HOME_LOOKS_SURGICAL_V2' not in partial: raise SystemExit('ABORT: unexpected Home Looks partial')
          backup=rel+'.bak-mobile-cache-'+stamp
          save_live(backup,partial)

          patched,count=re.subn(r'/assets/css/home-looks\.css\?v=[^\'\"]+', '/assets/css/home-looks.css?v=2.2.0', partial, count=1)
          if count != 1: raise SystemExit('ABORT: stylesheet URL not found exactly once')
          save_live(rel,patched)
          reread=read_live(rel)
          if '/assets/css/home-looks.css?v=2.2.0' not in reread: raise SystemExit('Partial verification failed')
          print('PASS backup',backup)
          print('PASS partial sha',hashlib.sha256(reread.encode()).hexdigest())

          purge='gramiss-purge-mobile-cache-'+stamp+'.php'
          php="<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php'; if(function_exists('do_action')){do_action('litespeed_purge_all');} echo 'OK'; @unlink(__FILE__);"
          call('save_file_content',{'dir':'public_html','file':purge,'content':php,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          with urllib.request.urlopen(urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'User-Agent':'GramissLooksMobileCacheBust/1'}),context=ctx,timeout=90) as r: print('PURGE',r.status,r.read().decode()[:50])

          st,b=public_get('https://gramiss.ir/?mobile_cache_post='+str(int(time.time())))
          html=b.decode('utf-8','replace')
          post={'home 200':st==200,'hero preserved':'g1-floating-hero' in html,'looks preserved':'data-g1-looks' in html,'css v2.2.0':'home-looks.css?v=2.2.0' in html,'order preserved':html.find('g1-signal-strip') < html.find('data-g1-looks') < html.find('id="collections"')}
          for label,ok in post.items(): print(('PASS' if ok else 'FAIL')+': post '+label)
          if not all(post.values()): raise SystemExit('Public verification failed')
          print('LIVE HOME LOOKS MOBILE CSS CACHE BUST V1 DEPLOYED')
          PY
