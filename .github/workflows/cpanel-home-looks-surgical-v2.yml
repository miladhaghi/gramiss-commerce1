name: cPanel Home Looks Card Overflow Fix V1

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/home-looks-visual-polish-deploy-v1'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Lift lower GRAMISS LOOKS cards inside section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, ssl, time, urllib.parse, urllib.request

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())
          marker='GRAMISS_HOME_LOOKS_CARD_OVERFLOW_FIX_V1'
          patch='''\n\n/* GRAMISS_HOME_LOOKS_CARD_OVERFLOW_FIX_V1 */\n@media (min-width:651px){\n  .g1-looks__spot--shoes .g1-looks__product-card{\n    top:auto;\n    bottom:-12px;\n    transform:translateY(8px) scale(.96);\n  }\n  .g1-looks__spot--shoes:hover .g1-looks__product-card,\n  .g1-looks__spot--shoes:focus-within .g1-looks__product-card,\n  .g1-looks__spot--shoes.is-active .g1-looks__product-card{\n    transform:translateY(0) scale(1);\n  }\n}\n'''

          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GramissLooksCardFix/1','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r: return r.status,r.read()

          st,b=public_get('https://gramiss.ir/?looks_card_fix_pre='+str(int(time.time())))
          html=b.decode('utf-8','replace')
          pre={
              'home 200':st==200,
              'hero':'g1-floating-hero' in html,
              'looks':'data-g1-looks' in html,
              'collections':'id="collections"' in html,
              'order':html.find('g1-signal-strip') < html.find('data-g1-looks') < html.find('id="collections"'),
          }
          for label,ok in pre.items(): print(('PASS' if ok else 'FAIL')+': preflight '+label)
          if not all(pre.values()): raise SystemExit('ABORT: live Home structure changed; nothing written')

          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=90) as r: obj=json.loads(r.read().decode('utf-8','replace'))
                      result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 {fn}: {exc}')
                      if attempt<5: time.sleep(attempt*3)
              raise last

          def read_live(rel):
              parent,name=rel.rsplit('/',1); directory=root+'/'+parent
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              if isinstance(d,str): return d
              raise RuntimeError('Unexpected live content: '+rel)

          def save_live(rel,content):
              parent,name=rel.rsplit('/',1); directory=root+'/'+parent
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          rel='assets/css/home-looks.css'
          css=read_live(rel)
          before=hashlib.sha256(css.encode()).hexdigest(); print('LIVE_CSS_BEFORE_SHA',before,'bytes',len(css.encode()))
          if 'GRAMISS_HOME_LOOKS_SURGICAL_V2' not in css: raise SystemExit('ABORT: expected Home Looks CSS marker missing')
          if marker in css:
              print('Patch already present; no duplicate write')
          else:
              backup=rel+'.bak-card-overflow-'+stamp
              save_live(backup,css)
              patched=css.rstrip()+patch
              save_live(rel,patched)
              reread=read_live(rel)
              if marker not in reread or '.g1-looks__spot--shoes .g1-looks__product-card' not in reread: raise SystemExit('Live CSS verification failed after write')
              print('PASS backup',backup)
              print('PASS live CSS patched sha',hashlib.sha256(reread.encode()).hexdigest(),'bytes',len(reread.encode()))

          purge='gramiss-purge-looks-card-fix-'+stamp+'.php'
          php="<?php define('WP_USE_THEMES',false); require __DIR__.'/wp-load.php'; if(function_exists('do_action')){do_action('litespeed_purge_all');} echo 'OK'; @unlink(__FILE__);"
          call('save_file_content',{'dir':'public_html','file':purge,'content':php,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)
          with urllib.request.urlopen(urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'User-Agent':'GramissLooksCardFix/1'}),context=ctx,timeout=90) as r: print('PURGE',r.status,r.read().decode()[:50])

          css_url='https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/css/home-looks.css?card_fix='+stamp
          st,b=public_get(css_url); public_css=b.decode('utf-8','replace')
          ok=st==200 and marker in public_css and 'bottom:-12px' in public_css
          print(('PASS' if ok else 'FAIL')+': public CSS card-overflow patch HTTP='+str(st))
          if not ok: raise SystemExit('Public CSS patch verification failed')

          st,b=public_get('https://gramiss.ir/?looks_card_fix_post='+str(int(time.time())))
          html=b.decode('utf-8','replace')
          post={
              'home 200':st==200,
              'hero preserved':'g1-floating-hero' in html,
              'looks preserved':'data-g1-looks' in html,
              'collections preserved':'id="collections"' in html,
              'order preserved':html.find('g1-signal-strip') < html.find('data-g1-looks') < html.find('id="collections"'),
          }
          for label,ok in post.items(): print(('PASS' if ok else 'FAIL')+': post '+label)
          if not all(post.values()): raise SystemExit('Public Home verification failed')
          print('LIVE HOME LOOKS CARD OVERFLOW FIX V1 DEPLOYED — LOWER CARDS LIFTED')
          PY
