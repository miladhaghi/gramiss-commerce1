name: cPanel Home Looks Surgical V2

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/home-looks-surgical-v2'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: b948b1fdf6a61c8a15ed3c8d22b034cb4c8a06d5fd8f4717311248e1dcbb5326
      LOOK1_SHA: 3da991f055fb526152cb7db17482deb852655869e0becde677fbe31900436e8d
      LOOK2_SHA: 7a607d9f7f99631c356eaf35593f21b14b7918e533cd83a9c8d5995cd1734e6f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/home-looks-surgical-v2

      - name: Deploy only the new Looks section and protect the existing Hero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']
          root=os.environ['THEME_ROOT'].strip('/'); healthy=os.environ['HEALTHY_HOME_SHA']
          img_sha={'gramiss-look-01.webp':os.environ['LOOK1_SHA'],'gramiss-look-02.webp':os.environ['LOOK2_SHA']}
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())

          def call(fn,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post:req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=90) as r: obj=json.loads(r.read().decode('utf-8','replace'))
                      result=obj.get('result') if isinstance(obj.get('result'),dict) else obj
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 {fn}: {exc}')
                      if attempt<5:time.sleep(attempt*3)
              raise last

          def read_text(directory,name):
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str):return d[k]
              if isinstance(d,str):return d
              raise RuntimeError('Unexpected content: '+name)

          def save_text(directory,name,content):
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          # HARD GUARD: deploy only against the exact healthy Home confirmed after rollback.
          front=read_text(root,'front-page.php'); before_sha=hashlib.sha256(front.encode()).hexdigest()
          print('LIVE_HOME_BEFORE_SHA',before_sha)
          if before_sha != healthy: raise SystemExit('ABORT: Home changed since confirmation; no live file modified')
          if 'data-g1-looks' in front: raise SystemExit('ABORT: Looks already present')

          anchor='    <section class="g1-section g1-reveal" id="collections">'
          pos=front.find(anchor)
          if pos<0: raise SystemExit('ABORT: collections anchor absent')
          protected=front[:pos]; protected_sha=hashlib.sha256(protected.encode()).hexdigest()
          if 'g1-floating-hero' not in protected or 'g1-signal-strip' not in protected: raise SystemExit('ABORT: protected Hero prefix invalid')
          print('PROTECTED_PREFIX_SHA',protected_sha)

          src=Path('.ops/home-looks')
          partial=(src/'home-looks.php').read_text(encoding='utf-8'); css=(src/'home-looks.css').read_text(encoding='utf-8'); js=(src/'home-looks.js').read_text(encoding='utf-8')
          if any('GRAMISS_HOME_LOOKS_SURGICAL_V2' not in x for x in (partial,css,js)): raise SystemExit('Staged text marker missing')

          images={}
          for key,prefix in [('gramiss-look-01.webp','look01-'),('gramiss-look-02.webp','look02-')]:
              parts=sorted(src.glob(prefix+'*.b64'))
              if not parts: raise SystemExit('No image chunks for '+key)
              raw=base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts),validate=True)
              got=hashlib.sha256(raw).hexdigest(); print('STAGED',key,'parts',len(parts),'bytes',len(raw),'sha',got)
              if got!=img_sha[key] or not(raw.startswith(b'RIFF') and b'WEBP' in raw[:16]): raise SystemExit('Invalid staged image '+key)
              images[key]=raw

          # Exact backup before any write.
          save_text(root,'front-page.php.bak-before-looks-surgical-'+stamp,front)

          payload={
              'template-parts/home-looks.php':partial.encode(),
              'assets/css/home-looks.css':css.encode(),
              'assets/js/home-looks.js':js.encode(),
              'assets/images/home/gramiss-look-01.webp':images['gramiss-look-01.webp'],
              'assets/images/home/gramiss-look-02.webp':images['gramiss-look-02.webp'],
          }
          packed={k:base64.b64encode(v).decode() for k,v in payload.items()}; expected={k:hashlib.sha256(v).hexdigest() for k,v in payload.items()}
          p64=base64.b64encode(json.dumps(packed,separators=(',',':')).encode()).decode(); e64=base64.b64encode(json.dumps(expected,separators=(',',':')).encode()).decode()
          nonce=hashlib.sha256((stamp+img_sha['gramiss-look-02.webp']).encode()).hexdigest(); installer='gramiss-looks-safe-'+stamp+'.php'
          php=f'''<?php
          ini_set('display_errors','0'); header('Content-Type: application/json; charset=utf-8');
          if(!isset($_GET['k'])||!hash_equals('{nonce}',(string)$_GET['k'])){{http_response_code(403);echo '{{"ok":false}}';exit;}}
          $theme=__DIR__.'/wp-content/themes/gramiss-theme-next';$payload=json_decode(base64_decode('{p64}'),true);$expected=json_decode(base64_decode('{e64}'),true);$out=array();
          foreach($payload as $rel=>$enc){{$target=$theme.'/'.$rel;$dir=dirname($target);if(!is_dir($dir))@mkdir($dir,0755,true);$bytes=base64_decode($enc,true);if($bytes===false)throw new Exception('decode');$tmp=$target.'.tmp-{stamp}';if(file_put_contents($tmp,$bytes,LOCK_EX)===false)throw new Exception('write');if(!hash_equals($expected[$rel],hash_file('sha256',$tmp)))throw new Exception('hash');if(file_exists($target))@copy($target,$target.'.bak-{stamp}');if(!@rename($tmp,$target))throw new Exception('rename');$out[$rel]=array('sha'=>hash_file('sha256',$target),'bytes'=>filesize($target));}}
          @unlink(__FILE__);echo json_encode(array('ok'=>true,'files'=>$out));?>'''
          save_text('public_html',installer,php)
          req=urllib.request.Request('https://gramiss.ir/'+installer+'?k='+urllib.parse.quote(nonce)+'&t='+str(int(time.time())),headers={'User-Agent':'GramissLooksSafe/2','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=120) as r: result=json.loads(r.read().decode('utf-8','replace'))
          if not result.get('ok'): raise SystemExit('Asset installer failed')
          for rel,sha in expected.items():
              got=((result.get('files') or {}).get(rel) or {}).get('sha'); print('LIVE_ASSET',rel,got)
              if got!=sha: raise SystemExit('Live asset mismatch '+rel)

          # Only one line is inserted in the existing live template.
          include="    <?php get_template_part( 'template-parts/home-looks' ); ?>\n\n"
          patched=front[:pos]+include+front[pos:]
          save_text(root,'front-page.php',patched)
          after=read_text(root,'front-page.php')
          if after!=patched: raise SystemExit('front-page write mismatch')
          if hashlib.sha256(after[:pos].encode()).hexdigest()!=protected_sha: raise SystemExit('PROTECTED HERO PREFIX CHANGED')
          if after.count("get_template_part( 'template-parts/home-looks' )")!=1: raise SystemExit('Include count invalid')
          print('PASS: everything before Collections, including Hero, is byte-for-byte unchanged')

          # LiteSpeed purge.
          purge='gramiss-purge-looks-'+stamp+'.php'; purge_php="<?php define('WP_USE_THEMES',false);require __DIR__.'/wp-load.php';if(function_exists('do_action')){do_action('litespeed_purge_all');}echo 'OK';@unlink(__FILE__);"
          save_text('public_html',purge,purge_php)
          with urllib.request.urlopen(urllib.request.Request('https://gramiss.ir/'+purge+'?t='+str(int(time.time())),headers={'Cache-Control':'no-cache'}),context=ctx,timeout=90) as r: print('PURGE',r.status)

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'GramissLooksVerify/2','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=90) as r:return r.status,r.headers,r.read()

          st,h,b=get('https://gramiss.ir/?looks_verify='+str(int(time.time()))); html=b.decode('utf-8','replace')
          checks={
            'HTTP 200':st==200,
            'Hero exists':'g1-floating-hero' in html and 'کمتر حدس بزن' in html,
            'Looks rendered server-side':'data-g1-looks' in html,
            'Approved headline':'GRAMISS LOOKS / 01' in html and 'استایل را لمس کن.' in html,
            'Correct order':0<=html.find('g1-signal-strip')<html.find('data-g1-looks')<html.find('id="collections"'),
            'Both models referenced':'gramiss-look-01.webp' in html and 'gramiss-look-02.webp' in html,
            'Product cards rendered':'product-card' in html,
          }
          for name,ok in checks.items():print(('PASS' if ok else 'FAIL')+': '+name)
          if not all(checks.values()):raise SystemExit('Public Home verification failed')

          for path,sha,min_size in [('assets/images/home/gramiss-look-01.webp',img_sha['gramiss-look-01.webp'],50000),('assets/images/home/gramiss-look-02.webp',img_sha['gramiss-look-02.webp'],80000)]:
              st,h,b=get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/'+path+'?v='+stamp); got=hashlib.sha256(b).hexdigest(); ok=st==200 and len(b)>=min_size and got==sha
              print(('PASS' if ok else 'FAIL')+': '+path+' bytes='+str(len(b))+' sha='+got)
              if not ok:raise SystemExit('Public model image failed')
          for path in ['assets/css/home-looks.css','assets/js/home-looks.js']:
              st,h,b=get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/'+path+'?v='+stamp);ok=st==200 and b'GRAMISS_HOME_LOOKS_SURGICAL_V2' in b
              print(('PASS' if ok else 'FAIL')+': '+path)
              if not ok:raise SystemExit('Public Looks asset failed')

          print('SUCCESS: GRAMISS LOOKS LIVE; HERO PRESERVED BYTE-FOR-BYTE')
          PY
