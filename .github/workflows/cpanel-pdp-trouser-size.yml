name: cPanel PDP Trouser Size Buttons

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/pdp-trouser-size'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Deploy trouser size button UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode()
              last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(), data=enc if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization', f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req, context=ctx, timeout=75) as r:
                          payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1:
                          raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 failed for {func}: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(f'Unexpected content for {rel}')

          def save_file(rel, content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          js=Path('deploy/pdp-trouser-size/trouser-size-ui.js').read_text(encoding='utf-8')
          header=get_file('header.php')
          start='<!-- GRAMISS PDP TROUSER SIZE START -->'; end='<!-- GRAMISS PDP TROUSER SIZE END -->'
          block=f'''{start}\n<?php if ( function_exists( 'is_product' ) && is_product() ) : ?>\n<script id="gramiss-pdp-trouser-size-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/product-trouser-size-ui.js?v=20260816-1' ); ?>"></script>\n<?php endif; ?>\n{end}'''
          if start in header and end in header:
              header_new=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header:
              header_new=header.replace('</head>',block+'\n</head>',1)
          else:
              raise RuntimeError('Could not locate </head>')

          save_file(f'header.php.bak-trousersize-{stamp}',header)
          print('Backup: header.php.bak-trousersize-'+stamp)
          save_file('assets/js/product-trouser-size-ui.js',js)
          save_file('header.php',header_new)

          live_header=get_file('header.php'); live_js=get_file('assets/js/product-trouser-size-ui.js')
          checks={
              'loader':'product-trouser-size-ui.js?v=20260816-1' in live_header,
              'marker':'GRAMISS_PDP_TROUSER_SIZE_UI_V1' in live_js,
              'trouser detection':'سایز شلوار' in live_js and 'trouser-size' in live_js,
              'button group':'g3-trouser-size-options' in live_js,
              'Woo sync':"trigger('change')" in live_js or "trigger(\"change\")" in live_js,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('Trouser size UI verification failed')
          print('LIVE PDP TROUSER SIZE BUTTON UI DEPLOYED AND VERIFIED')
          PY
