name: cPanel PDP First Paint Fix

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/pdp-first-paint-fix'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      PUBLIC_ROOT: public_html
    steps:
      - name: Fix PDP first paint and coordinate variation UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/'); public=os.environ['PUBLIC_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S',time.gmtime())
          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(),data=enc if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r: p=json.loads(r.read().decode())
                      result=p.get('result') if isinstance(p.get('result'),dict) else p
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 failed {func}: {exc}')
                      if attempt<5: time.sleep(attempt*3)
              raise last
          def read_from(base,rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=base if not parent else f'{base}/{parent}'
              d=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(d,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(d.get(k),str): return d[k]
              return d if isinstance(d,str) else ''
          def save_to(base,rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=base if not parent else f'{base}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)
          def read(rel): return read_from(root,rel)
          def save(rel,content): save_to(root,rel,content)

          header=read('header.php'); runtime=read('assets/js/product-runtime-fix.js'); variation=read('assets/js/product-runtime-variation-ui.js')
          save(f'header.php.bak-firstpaint-{stamp}',header)
          save(f'assets/js/product-runtime-fix.js.bak-firstpaint-{stamp}',runtime)
          save(f'assets/js/product-runtime-variation-ui.js.bak-firstpaint-{stamp}',variation)
          print('Backups created',stamp)

          # 1) Fix the gate selector: current live product main is #primary.gramiss-main.gramiss-commerce-main, not .site-main.
          style_pattern=r'<style id="gramiss-pdp-first-paint-style">.*?</style>'
          style_new='''<style id="gramiss-pdp-first-paint-style">\nhtml.gramiss-pdp-booting body.single-product main#primary,\nhtml.gramiss-pdp-booting body.single-product main.gramiss-main,\nhtml.gramiss-pdp-booting body.single-product main.gramiss-commerce-main,\nhtml.gramiss-pdp-booting body.single-product .gramiss-commerce-main,\nhtml.gramiss-pdp-booting body.single-product main.site-main,\nhtml.gramiss-pdp-booting body.single-product .site-main{visibility:hidden!important;opacity:0!important;pointer-events:none!important;min-height:70vh!important;}\n</style>'''
          if not re.search(style_pattern,header,re.S): raise RuntimeError('First-paint style block missing; refusing blind patch')
          header_new=re.sub(style_pattern,style_new,header,count=1,flags=re.S)

          # 2) Runtime must not reveal the page before variation buttons are constructed.
          release_old="""function releaseBoot(){\n    document.documentElement.classList.remove('gramiss-pdp-booting');\n    document.documentElement.classList.add('gramiss-pdp-booted');\n  }"""
          release_new="""function releaseBoot(force){\n    var root=document.documentElement;\n    var variationForm=document.querySelector('form.variations_form');\n    var variationLoader=document.getElementById('gramiss-pdp-variation-ui-js');\n    if(!force && variationForm && variationLoader && !root.classList.contains('gramiss-pdp-variations-ready')) return;\n    root.classList.remove('gramiss-pdp-booting');\n    root.classList.add('gramiss-pdp-booted');\n  }\n  document.addEventListener('gramiss:pdp-variations-ready',function(){ releaseBoot(true); });"""
          if release_old in runtime:
              runtime_new=runtime.replace(release_old,release_new,1)
          elif "gramiss:pdp-variations-ready" in runtime and "function releaseBoot(force)" in runtime:
              runtime_new=runtime
          else:
              raise RuntimeError('Runtime releaseBoot signature changed; refusing blind patch')
          runtime_new=runtime_new.replace('window.setTimeout(releaseBoot,3500);','window.setTimeout(function(){ releaseBoot(true); },3500);')

          # 3) Variation UI explicitly signals readiness after all color/size buttons are built.
          boot_pattern=r"function boot\(\)\{\s*var shell=document\.querySelector\('\.gramiss-pdp-runtime-v3'\);\s*if\(!shell\) return;\s*Array\.prototype\.forEach\.call\(shell\.querySelectorAll\('form\.variations_form'\),initForm\);\s*\}"
          boot_new="""function markReady(){\n    var root=document.documentElement;\n    if(root.classList.contains('gramiss-pdp-variations-ready')) return;\n    root.classList.add('gramiss-pdp-variations-ready');\n    try{ document.dispatchEvent(new CustomEvent('gramiss:pdp-variations-ready')); }\n    catch(e){ var ev=document.createEvent('Event'); ev.initEvent('gramiss:pdp-variations-ready',true,true); document.dispatchEvent(ev); }\n  }\n\n  function boot(){\n    var shell=document.querySelector('.gramiss-pdp-runtime-v3');\n    if(!shell){ markReady(); return; }\n    Array.prototype.forEach.call(shell.querySelectorAll('form.variations_form'),initForm);\n    markReady();\n  }"""
          if re.search(boot_pattern,variation,re.S):
              variation_new=re.sub(boot_pattern,boot_new,variation,count=1,flags=re.S)
          elif 'gramiss-pdp-variations-ready' in variation and "function markReady()" in variation:
              variation_new=variation
          else:
              raise RuntimeError('Variation boot signature changed; refusing blind patch')

          header_new=re.sub(r'product-runtime-fix\.js\?v=[0-9A-Za-z._-]+','product-runtime-fix.js?v=20260826-2',header_new)
          header_new=re.sub(r'product-runtime-variation-ui\.js\?v=[0-9A-Za-z._-]+','product-runtime-variation-ui.js?v=20260826-2',header_new)
          save('assets/js/product-runtime-fix.js',runtime_new)
          save('assets/js/product-runtime-variation-ui.js',variation_new)
          save('header.php',header_new)

          # Live-file verification before cache purge.
          live_header=read('header.php'); live_runtime=read('assets/js/product-runtime-fix.js'); live_variation=read('assets/js/product-runtime-variation-ui.js')
          checks={
              'gate targets #primary':'body.single-product main#primary' in live_header,
              'gate targets commerce main':'body.single-product main.gramiss-commerce-main' in live_header,
              'runtime waits variation':'gramiss-pdp-variations-ready' in live_runtime and 'function releaseBoot(force)' in live_runtime,
              'runtime listens ready event':"gramiss:pdp-variations-ready" in live_runtime,
              'variation signals ready':'function markReady()' in live_variation and 'gramiss-pdp-variations-ready' in live_variation,
              'runtime cache bust':'product-runtime-fix.js?v=20260826-2' in live_header,
              'variation cache bust':'product-runtime-variation-ui.js?v=20260826-2' in live_header,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if not all(checks.values()): raise SystemExit('Live first-paint verification failed')

          # Purge LiteSpeed so the exact public product URL cannot keep stale head markup.
          purge_name=f'gramiss-pdp-firstpaint-purge-{int(time.time())}.php'
          purge_php="""<?php\nheader('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');\nheader('X-LiteSpeed-Purge: public,*');\ndefine('WP_USE_THEMES', false);\nrequire __DIR__ . '/wp-load.php';\nif (function_exists('do_action')) { do_action('litespeed_purge_all'); do_action('litespeed_purge_front'); }\necho 'GRAMISS_PDP_CACHE_PURGED';\n@unlink(__FILE__);\n"""
          save_to(public,purge_name,purge_php)
          req=urllib.request.Request(f'https://gramiss.ir/{purge_name}?t={int(time.time())}',headers={'User-Agent':'Mozilla/5.0 GramissPurge/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=60) as r:
              purge_body=r.read().decode('utf-8','replace'); print('Purge HTTP',r.status)
          if 'GRAMISS_PDP_CACHE_PURGED' not in purge_body: raise SystemExit('LiteSpeed purge did not confirm')
          time.sleep(3)

          slug='کتونی-سبک-ونس-سفید'
          product_url='https://gramiss.ir/?'+urllib.parse.urlencode({'product':slug})
          def public_get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GramissFirstPaintVerify/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,context=ctx,timeout=75) as r: return r.status,r.headers,r.read().decode('utf-8','replace')
          for label in ('PDP #1','PDP #2'):
              status,headers,html=public_get(product_url)
              ok=('body.single-product main#primary' in html and 'product-runtime-fix.js?v=20260826-2' in html and 'product-runtime-variation-ui.js?v=20260826-2' in html)
              print(label,'HTTP',status,'cache',headers.get('X-LiteSpeed-Cache'),'markers',ok)
              if status!=200 or not ok: raise SystemExit(label+' serves stale/invalid first-paint markup')
              time.sleep(1)
          status,_,served_runtime=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/js/product-runtime-fix.js?v=20260826-2')
          if status!=200 or 'function releaseBoot(force)' not in served_runtime or 'gramiss-pdp-variations-ready' not in served_runtime: raise SystemExit('Public runtime JS verification failed')
          status,_,served_variation=public_get('https://gramiss.ir/wp-content/themes/gramiss-theme-next/assets/js/product-runtime-variation-ui.js?v=20260826-2')
          if status!=200 or 'function markReady()' not in served_variation or 'gramiss-pdp-variations-ready' not in served_variation: raise SystemExit('Public variation JS verification failed')
          print('SUCCESS: PDP FIRST PAINT GATE MATCHES LIVE MAIN, WAITS FOR VARIATION UI, CACHE PURGED, PUBLIC ASSETS VERIFIED')
          PY
