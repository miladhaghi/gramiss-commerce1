name: cPanel Home Hero Scroll Guard V7

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/home-scrollguard-v7'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wordpress-migration
      - name: Deploy Home hero scroll interaction guard
        run: python3 deploy/home-hero/deploy_home_scroll_guard_v7.py
