name: cPanel Home Hero Hover V6

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/home-hover-v6'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wordpress-migration
      - name: Deploy instant Home hero hover response
        run: python3 deploy/home-hero/deploy_home_hover_response_v6.py
