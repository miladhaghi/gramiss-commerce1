name: cPanel Shop Sculpted

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/shop-sculpted'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Deploy sculpted Shop cards and no-flash boot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(), data=enc if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization', f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req, context=ctx, timeout=75) as r:
                          payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1:
                          raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 failed for {func}: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(f'Unexpected content for {rel}')

          def save_file(rel, content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          css=Path('deploy/shop-sculpted/shop-sculpted.css').read_text(encoding='utf-8')
          js=Path('deploy/shop-sculpted/shop-sculpted.js').read_text(encoding='utf-8')
          header=get_file('header.php')
          start='<!-- GRAMISS SHOP EDITORIAL START -->'
          end='<!-- GRAMISS SHOP EDITORIAL END -->'
          block=f'''{start}\n<?php\n$gramiss_shop_catalog = false;\nif ( function_exists( 'is_shop' ) ) {{\n    $gramiss_shop_catalog = is_shop()\n        || ( function_exists( 'is_product_taxonomy' ) && is_product_taxonomy() )\n        || is_post_type_archive( 'product' )\n        || ( is_search() && 'product' === get_query_var( 'post_type' ) );\n}}\nif ( $gramiss_shop_catalog ) {{\n    add_filter( 'single_product_archive_thumbnail_size', function( $size ) {{ return 'full'; }}, 999 );\n}}\nif ( $gramiss_shop_catalog ) : ?>\n<script id="gramiss-shop-first-paint-gate">\n(function(d,w){d.documentElement.classList.add('gramiss-shop-booting');w.setTimeout(function(){d.documentElement.classList.remove('gramiss-shop-booting');},3200);})(document,window);\n</script>\n<style id="gramiss-shop-first-paint-style">\nhtml.gramiss-shop-booting body main.site-main,html.gramiss-shop-booting body #main{visibility:hidden!important;opacity:0!important;pointer-events:none!important;min-height:72vh!important;}\n</style>\n<link id="gramiss-shop-sculpted-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/shop-sculpted.css?v=20260812-1' ); ?>">\n<script id="gramiss-shop-sculpted-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/shop-sculpted.js?v=20260812-1' ); ?>"></script>\n<?php endif; ?>\n{end}'''
          if start in header and end in header:
              header_new=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header:
              header_new=header.replace('</head>',block+'\n</head>',1)
          else:
              raise RuntimeError('Could not locate </head>')

          save_file(f'header.php.bak-shopsculpted-{stamp}',header)
          print('Backup: header.php.bak-shopsculpted-'+stamp)
          save_file('assets/css/shop-sculpted.css',css)
          save_file('assets/js/shop-sculpted.js',js)
          save_file('header.php',header_new)

          live_header=get_file('header.php')
          live_css=get_file('assets/css/shop-sculpted.css')
          live_js=get_file('assets/js/shop-sculpted.js')
          checks={
              'shop gate': 'gramiss-shop-first-paint-gate' in live_header and 'gramiss-shop-booting' in live_header,
              'full archive image': "single_product_archive_thumbnail_size" in live_header and "return 'full'" in live_header,
              'v3 css loader': 'shop-sculpted.css?v=20260812-1' in live_header,
              'v3 js loader': 'shop-sculpted.js?v=20260812-1' in live_header,
              'css marker': 'GRAMISS_SHOP_SCULPTED_V1' in live_css,
              'page gradient': 'linear-gradient(180deg,#fff 0%,#f2f3f4 52%,#fff 100%)' in ''.join(live_css.split()),
              'white media': '.gse-media-frame' in live_css and 'background:#fff!important' in live_css,
              'top action orb': 'gse-action-orb' in live_css and 'top:18px' in live_css,
              'bottom sculpt': 'gse-info-panel' in live_css and 'border-top-right-radius:64px' in live_css,
              'js marker': 'GRAMISS_SHOP_SCULPTED_V1' in live_js,
              'info wrapper': 'ensureInfoPanel' in live_js,
              'action wrapper': 'ensureActionOrb' in live_js,
              'sorting': 'gse-sort-button' in live_js and 'orderby' in live_js,
              'search': 'gse-search-input' in live_js and 'post_type' in live_js,
              'boot release': "classList.remove('gramiss-shop-booting')" in live_js,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('Shop sculpted verification failed')
          print('LIVE SHOP SCULPTED V1 DEPLOYED AND VERIFIED')
          PY
