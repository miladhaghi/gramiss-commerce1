name: cPanel Cart Success Motion Deploy

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/cart-success-motion'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Checkout Gramiss source
        uses: actions/checkout@v4
        with:
          ref: wordpress-migration

      - name: Deploy premium cart success notice and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host = os.environ['CPANEL_HOST']
          user = os.environ['CPANEL_USER']
          token = os.environ['CPANEL_TOKEN']
          root = os.environ['THEME_ROOT'].strip('/')
          ctx = ssl._create_unverified_context()
          stamp = time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url = f'https://{host}:2083/execute/Fileman/{func}'
              enc = urllib.parse.urlencode(params).encode()
              last = None
              for attempt in range(1, 6):
                  try:
                      req = urllib.request.Request(
                          url if post else url + '?' + enc.decode(),
                          data=enc if post else None,
                          method='POST' if post else 'GET',
                      )
                      req.add_header('Authorization', f'cpanel {user}:{token}')
                      if post:
                          req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req, context=ctx, timeout=75) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      result = payload.get('result') if isinstance(payload.get('result'), dict) else payload
                      if not isinstance(result, dict) or result.get('status') != 1:
                          raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result, dict) else "unknown"}')
                      return result.get('data')
                  except Exception as exc:
                      last = exc
                      print(f'Attempt {attempt}/5 failed for {func}: {exc}')
                      if attempt < 5:
                          time.sleep(attempt * 4)
              raise last

          def get_file(rel):
              parent, name = rel.rsplit('/', 1) if '/' in rel else ('', rel)
              directory = root if not parent else f'{root}/{parent}'
              data = call('get_file_content', {
                  'dir': directory,
                  'file': name,
                  'from_charset': '_DETECT_',
                  'to_charset': 'utf-8',
              })
              if isinstance(data, dict):
                  for key in ('content', 'file_content', 'data'):
                      if isinstance(data.get(key), str):
                          return data[key]
              if isinstance(data, str):
                  return data
              raise RuntimeError(f'Unexpected content payload for {rel}')

          def save_file(rel, content):
              parent, name = rel.rsplit('/', 1) if '/' in rel else ('', rel)
              directory = root if not parent else f'{root}/{parent}'
              call('save_file_content', {
                  'dir': directory,
                  'file': name,
                  'content': content,
                  'from_charset': 'UTF-8',
                  'to_charset': 'UTF-8',
                  'fallback': '0',
              }, post=True)

          marker_start = '/* GRAMISS CART SUCCESS START */'
          marker_end = '/* GRAMISS CART SUCCESS END */'
          source = Path('wordpress/gramiss-theme/inc/woocommerce.php').read_text(encoding='utf-8')
          if marker_start not in source or marker_end not in source:
              raise RuntimeError('Cart-success source markers are missing; refusing blind deploy')
          block = marker_start + source.split(marker_start, 1)[1].split(marker_end, 1)[0] + marker_end

          rel = 'inc/woocommerce.php'
          live = get_file(rel)
          save_file(f'inc/woocommerce.php.bak-cart-success-{stamp}', live)
          print('Backup created: ' + stamp)

          if marker_start in live and marker_end in live:
              prefix = live.split(marker_start, 1)[0]
              suffix = live.split(marker_end, 1)[1]
              patched = prefix.rstrip() + '\n\n' + block + '\n' + suffix.lstrip()
          elif re.search(r'<\?php', live):
              closing = re.search(r'\?>\s*$', live)
              if closing:
                  patched = live[:closing.start()].rstrip() + '\n\n' + block + '\n\n' + live[closing.start():]
              else:
                  patched = live.rstrip() + '\n\n' + block + '\n'
          else:
              raise RuntimeError('Live WooCommerce integration is not a PHP file; refusing deploy')

          save_file(rel, patched)
          verified = get_file(rel)
          checks = {
              'marker': marker_start in verified and marker_end in verified,
              'Woo filter': "add_filter( 'wc_add_to_cart_message_html'" in verified,
              'premium notice class': 'gramiss-cart-success__check' in verified,
              'check animation': 'gramiss-success-check-pop' in verified,
              'reduced-motion support': 'prefers-reduced-motion:reduce' in verified,
          }
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit('Live cart-success code verification failed')

          product_url = 'https://gramiss.ir/?' + urllib.parse.urlencode({'product': 'پیراهن-آستین-بلند-پارچه-سیلک'})
          req = urllib.request.Request(product_url, headers={'User-Agent': 'GramissDeployCheck/1.0'})
          with urllib.request.urlopen(req, timeout=75) as response:
              html = response.read().decode('utf-8', 'replace')
              status = response.status
          print(f'Product page HTTP status: {status}')
          if status != 200:
              raise SystemExit('Product page did not return HTTP 200 after deploy')
          if 'gramiss-success-check-pop' not in html:
              raise SystemExit('Product page loaded, but cart-success CSS was not emitted')

          print('LIVE PREMIUM CART SUCCESS NOTICE DEPLOYED AND VERIFIED')
          PY
