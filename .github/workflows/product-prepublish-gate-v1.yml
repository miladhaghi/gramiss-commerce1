name: Gramiss Product Pre-Publish Gate V1

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: WooCommerce product ID
        required: true
        type: string
      mode:
        description: Gate mode
        required: true
        default: prepublish
        type: choice
        options:
          - prepublish
          - postpublish
      index_intent:
        description: Intended robots state
        required: true
        default: index
        type: choice
        options:
          - index
          - noindex
      report_only:
        description: Report blockers without failing the workflow
        required: true
        default: false
        type: boolean

jobs:
  product-gate:
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
      HEALTHY_HOME_SHA: 0e5b79e88279812dbb20a7728061cee3ec00c79b6ef1894c3049d42856b795a7
    steps:
      - uses: actions/checkout@v4
      - name: Validate gate implementation
        run: |
          python3 -m py_compile .ops/product-prepublish-gate-v1.py
          python3 .ops/product-prepublish-gate-v1.py --self-test
      - name: Run product gate
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.report_only }}" = "true" ]; then EXTRA="--report-only"; fi
          python3 .ops/product-prepublish-gate-v1.py \
            --product-id "${{ inputs.product_id }}" \
            --mode "${{ inputs.mode }}" \
            --index-intent "${{ inputs.index_intent }}" \
            $EXTRA
