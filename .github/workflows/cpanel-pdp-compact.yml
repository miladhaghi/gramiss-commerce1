name: cPanel PDP Compact

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/pdp-compact'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Deploy compact PDP, dual gallery and variation swatches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode()
              last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(), data=enc if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization', f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req, context=ctx, timeout=75) as r:
                          payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1:
                          raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
                      return result.get('data')
                  except Exception as exc:
                      last=exc
                      print(f'Attempt {attempt}/5 failed for {func}: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(f'Unexpected content for {rel}')

          def save_file(rel, content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          css=Path('deploy/pdp-compact/product-runtime-compact.css').read_text(encoding='utf-8')
          gallery_js=Path('deploy/pdp-compact/product-runtime-gallery-fix.js').read_text(encoding='utf-8')
          variation_js=Path('deploy/pdp-compact/product-runtime-variation-ui.js').read_text(encoding='utf-8')
          header=get_file('header.php')
          start='<!-- GRAMISS PDP COMPACT START -->'
          end='<!-- GRAMISS PDP COMPACT END -->'
          block=f'''{start}\n<?php if ( function_exists( 'is_product' ) && is_product() ) : ?>\n<link id="gramiss-pdp-compact-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/product-runtime-compact.css?v=20260810-4' ); ?>">\n<script id="gramiss-pdp-gallery-switch-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/product-runtime-gallery-fix.js?v=20260810-4' ); ?>"></script>\n<script id="gramiss-pdp-variation-ui-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/product-runtime-variation-ui.js?v=20260810-4' ); ?>"></script>\n<?php endif; ?>\n{end}'''
          if start in header and end in header:
              header_new=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header:
              header_new=header.replace('</head>',block+'\n</head>',1)
          else:
              raise RuntimeError('Could not locate </head>')

          save_file(f'header.php.bak-pdpswatches-{stamp}',header)
          print('Backup: header.php.bak-pdpswatches-'+stamp)
          save_file('assets/css/product-runtime-compact.css',css)
          save_file('assets/js/product-runtime-gallery-fix.js',gallery_js)
          save_file('assets/js/product-runtime-variation-ui.js',variation_js)
          save_file('header.php',header_new)

          live_header=get_file('header.php')
          live_css=get_file('assets/css/product-runtime-compact.css')
          live_gallery=get_file('assets/js/product-runtime-gallery-fix.js')
          live_variation=get_file('assets/js/product-runtime-variation-ui.js')
          compact=''.join(live_css.split())
          checks={
              'compact loader': 'product-runtime-compact.css?v=20260810-4' in live_header,
              'gallery loader': 'product-runtime-gallery-fix.js?v=20260810-4' in live_header,
              'variation loader': 'product-runtime-variation-ui.js?v=20260810-4' in live_header,
              'compact marker': 'Gramiss PDP Compact v1' in live_css,
              'compact purchase height': 'min-height:520px!important' in compact,
              'gallery marker': 'GRAMISS_PDP_GALLERY_SWITCH_V3' in live_gallery,
              'dual stage logic': 'g3-dual-stage' in live_gallery and 'g3ApplyVariationImage' in live_gallery,
              'variation UI marker': 'GRAMISS_PDP_VARIATION_UI_V1' in live_variation,
              'Woo select sync': 'attribute_' in live_variation and "trigger('change')" in live_variation,
              'swatch styling': '.g3-color-option' in live_css and '.g3-size-option' in live_css,
              'pointer motion blocked': "'mousemove','pointermove'" in live_gallery,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('PDP swatch deployment verification failed')
          print('LIVE PDP SWATCHES + DUAL GALLERY DEPLOYED AND VERIFIED')
          PY
