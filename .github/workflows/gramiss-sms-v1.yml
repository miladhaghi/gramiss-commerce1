name: Gramiss SMS V1

on:
  push:
    branches: [ops/gramiss-sms-v1]

jobs:
  verify-gramiss-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint Gramiss SMS plugin
        run: php -l wordpress/plugins/gramiss-sms/gramiss-sms.php
      - name: Compile SMS tools
        run: python3 -m py_compile .ops/verify-gramiss-sms-v1.py .ops/inspect-gramiss-sms-live.py .ops/enable-gramiss-sms-auto.py
      - name: Enable automatic SMS safely
        run: python3 .ops/enable-gramiss-sms-auto.py
      - name: Verify live Gramiss SMS V1 read only
        run: python3 .ops/verify-gramiss-sms-v1.py
      - name: Inspect live SMS trigger state
        run: python3 .ops/inspect-gramiss-sms-live.py
