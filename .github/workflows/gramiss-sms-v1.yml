name: Gramiss SMS V1

on:
  push:
    branches: [ops/gramiss-sms-v1]

jobs:
  deploy-gramiss-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint Gramiss SMS plugin
        run: php -l wordpress/plugins/gramiss-sms/gramiss-sms.php
      - name: Compile guarded deploy
        run: python3 -m py_compile .ops/deploy-gramiss-sms-v1.py
      - name: Deploy and activate Gramiss SMS V1
        run: python3 .ops/deploy-gramiss-sms-v1.py
