name: Deploy PDP Live Hotfix

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'fix/pdp-live-direct'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4

      - name: Backup, deploy and verify only PDP files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              data=urllib.parse.urlencode(params).encode()
              req=urllib.request.Request(url if post else url+'?'+data.decode(), data=data if post else None, method='POST' if post else 'GET')
              req.add_header('Authorization', f'cpanel {user}:{token}')
              if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
              with urllib.request.urlopen(req, context=ctx, timeout=45) as r: payload=json.loads(r.read().decode())
              result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
              if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
              return result.get('data')

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(f'Unexpected content for {rel}')

          def save_file(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          current_single=get_file('single-product.php'); current_header=get_file('header.php'); current_css=get_file('assets/css/product-detail.css')
          for rel,current in [('single-product.php',current_single),('header.php',current_header),('assets/css/product-detail.css',current_css)]:
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); bak=(f'{parent}/' if parent else '')+name+f'.bak-{stamp}'; save_file(bak,current); print('Backup:',bak)

          new_single=Path('deploy/pdp-live/single-product.php').read_text(encoding='utf-8')
          patch=Path('deploy/pdp-live/product-detail.css').read_text(encoding='utf-8').strip()
          fixed_header=current_header.replace('<head><meta charset="utf-8">\n    ">\n','<head>\n    <meta charset="utf-8">\n').replace('<head><meta charset="utf-8">\r\n    ">\r\n','<head>\r\n    <meta charset="utf-8">\r\n')
          marker='/* Gramiss PDP structural hotfix v1.3.0 */'
          base_css=current_css.split(marker,1)[0].rstrip() if marker in current_css else current_css.rstrip()
          new_css=base_css+'\n\n'+patch+'\n'

          expected={'header.php':fixed_header,'single-product.php':new_single,'assets/css/product-detail.css':new_css}
          for rel,content in expected.items(): save_file(rel,content)
          for rel,wanted in expected.items():
              actual=get_file(rel)
              if hashlib.sha256(actual.encode()).hexdigest()!=hashlib.sha256(wanted.encode()).hexdigest(): raise RuntimeError(f'Verification failed: {rel}')
              print('Verified:',rel)
          print('LIVE PDP HOTFIX DEPLOYED')
          PY
