name: cPanel Mobile Viewport + Gallery Fix

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/mobile-viewport-gallery'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Fix mobile viewport overflow and PDP thumbnail tap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode()
              last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(), data=enc if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization', f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req, context=ctx, timeout=75) as r:
                          payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1:
                          raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 failed for {func}: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(f'Unexpected content for {rel}')

          def save_file(rel, content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          header=get_file('header.php')
          gallery_rel='assets/js/product-runtime-gallery-fix.js'
          gallery=get_file(gallery_rel)
          save_file(f'header.php.bak-mobilefix-{stamp}',header)
          save_file(f'assets/js/product-runtime-gallery-fix.js.bak-mobilefix-{stamp}',gallery)
          print('Backups created:', stamp)

          mobile_css=r'''/* GRAMISS_MOBILE_VIEWPORT_FIX_V1 */
@media (max-width: 860px){
  html{
    width:100%!important;
    max-width:100%!important;
    overflow-x:hidden!important;
    overflow-x:clip!important;
  }
  body{
    width:100%!important;
    max-width:100%!important;
    overflow-x:hidden!important;
    overflow-x:clip!important;
    overscroll-behavior-x:none!important;
  }
  #page,
  .site,
  .site-content,
  #content,
  #primary,
  main.site-main{
    max-width:100%!important;
    min-width:0!important;
  }
  header,
  .site-header{
    max-width:100%!important;
  }
  img,
  svg,
  video,
  canvas{
    max-width:100%;
  }
}
'''
          save_file('assets/css/mobile-viewport-fix.css',mobile_css)

          marker_start='<!-- GRAMISS MOBILE VIEWPORT FIX START -->'
          marker_end='<!-- GRAMISS MOBILE VIEWPORT FIX END -->'
          block=marker_start+"\n"+"<link rel=\"stylesheet\" id=\"gramiss-mobile-viewport-fix-css\" href=\"<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/mobile-viewport-fix.css?v=20260817-1' ); ?>\" media=\"(max-width: 860px)\">\n"+marker_end
          if marker_start in header and marker_end in header:
              before,rest=header.split(marker_start,1)
              _,after=rest.split(marker_end,1)
              header=before+block+after
          elif '</head>' in header:
              header=header.replace('</head>',block+'\n</head>',1)
          else:
              raise RuntimeError('header.php has no </head>; refusing blind injection')

          needle="""      thumb.addEventListener('click',activate,true);\n      thumb.addEventListener('keydown',function(event){"""
          replacement="""      thumb.addEventListener('click',activate,true);\n\n      var g3TouchStartX=0, g3TouchStartY=0, g3TouchMoved=false;\n      thumb.addEventListener('touchstart',function(event){\n        var touch=event.changedTouches && event.changedTouches[0];\n        if(!touch) return;\n        g3TouchStartX=touch.clientX;\n        g3TouchStartY=touch.clientY;\n        g3TouchMoved=false;\n      },{capture:true,passive:true});\n      thumb.addEventListener('touchmove',function(event){\n        var touch=event.changedTouches && event.changedTouches[0];\n        if(!touch) return;\n        if(Math.abs(touch.clientX-g3TouchStartX)>10 || Math.abs(touch.clientY-g3TouchStartY)>10) g3TouchMoved=true;\n      },{capture:true,passive:true});\n      thumb.addEventListener('touchend',function(event){\n        if(g3TouchMoved) return;\n        activate(event);\n      },{capture:true,passive:false});\n\n      thumb.addEventListener('keydown',function(event){"""
          if 'g3TouchStartX' not in gallery:
              if needle not in gallery:
                  raise RuntimeError('Gallery thumb click signature not found; refusing blind patch')
              gallery=gallery.replace(needle,replacement,1)

          gallery=gallery.replace('/* GRAMISS_PDP_GALLERY_SWITCH_V3 */','/* GRAMISS_PDP_GALLERY_SWITCH_V4_MOBILE_TAP */',1)
          save_file(gallery_rel,gallery)

          header=re.sub(r'product-runtime-gallery-fix\.js\?v=[0-9A-Za-z._-]+','product-runtime-gallery-fix.js?v=20260817-4',header)
          save_file('header.php',header)

          live_header=get_file('header.php')
          live_css=get_file('assets/css/mobile-viewport-fix.css')
          live_gallery=get_file(gallery_rel)
          checks={
              'mobile viewport CSS':'GRAMISS_MOBILE_VIEWPORT_FIX_V1' in live_css,
              'horizontal overflow clamp':'overflow-x:clip!important' in live_css,
              'mobile CSS loader':'gramiss-mobile-viewport-fix-css' in live_header,
              'gallery v4 marker':'GRAMISS_PDP_GALLERY_SWITCH_V4_MOBILE_TAP' in live_gallery,
              'touch start':'g3TouchStartX' in live_gallery,
              'touch end activation':"thumb.addEventListener('touchend'" in live_gallery,
              'gallery cache bust':'product-runtime-gallery-fix.js?v=20260817-4' in live_header,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('Mobile fixes verification failed')
          print('LIVE MOBILE VIEWPORT + PDP THUMB TAP FIX DEPLOYED AND VERIFIED')
          PY
