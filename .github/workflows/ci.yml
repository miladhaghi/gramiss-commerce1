name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storefront:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_COMMERCE_MODE: demo
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ""
      NEXT_PUBLIC_ROBOTS_INDEX: "false"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
      NPM_CONFIG_MAXSOCKETS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install storefront dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Storefront dependency install attempt ${attempt}/4"
            if npm install --prefix apps/storefront --no-audit --no-fund --prefer-offline; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Storefront dependency installation failed after 4 attempts."
              exit 1
            fi

            delay=$((attempt * 45))
            echo "npm registry request failed; waiting ${delay}s before retry..."
            sleep "$delay"
          done

      - name: Lint storefront
        run: npm run --prefix apps/storefront lint

      - name: Type-check storefront
        run: npm run --prefix apps/storefront typecheck

      - name: Build storefront
        run: npm run --prefix apps/storefront build

  backend:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://gramiss:gramiss@localhost:5432/gramiss
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      JWT_SECRET: ci-only-secret-ci-only-secret-123
      COOKIE_SECRET: ci-only-secret-ci-only-secret-456
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
      NPM_CONFIG_MAXSOCKETS: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "Backend dependency install attempt ${attempt}/4"
            if npm install --prefix apps/backend --no-audit --no-fund --prefer-offline; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Backend dependency installation failed after 4 attempts."
              exit 1
            fi

            delay=$((attempt * 45))
            echo "npm registry request failed; waiting ${delay}s before retry..."
            sleep "$delay"
          done

      - name: Validate catalog migration data
        run: npm run --prefix apps/backend catalog:validate

      - name: Build backend
        run: npm run --prefix apps/backend build

  docker-storefront:
    needs: storefront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build storefront image
        run: docker build --file Dockerfile.storefront --tag gramiss-storefront:ci .

  docker-backend:
    needs: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file Dockerfile.backend --tag gramiss-backend:ci .

  mobile-live-deploy:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/mobile-fix-ci'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Deploy mobile viewport and gallery tap fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, ssl, time, urllib.parse, urllib.request
          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func,params,post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'; enc=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(),data=enc if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=75) as r: payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result.get('errors') if isinstance(result,dict) else 'UAPI failed'))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 failed: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError('Unexpected content '+rel)

          def save_file(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          header=get_file('header.php'); rel='assets/js/product-runtime-gallery-fix.js'; gallery=get_file(rel)
          save_file(f'header.php.bak-mobilefix-{stamp}',header)
          save_file(f'assets/js/product-runtime-gallery-fix.js.bak-mobilefix-{stamp}',gallery)
          print('Backups:',stamp)

          css='''/* GRAMISS_MOBILE_VIEWPORT_FIX_V1 */
@media (max-width:860px){
html{width:100%!important;max-width:100%!important;overflow-x:hidden!important;overflow-x:clip!important}
body{width:100%!important;max-width:100%!important;overflow-x:hidden!important;overflow-x:clip!important;overscroll-behavior-x:none!important}
#page,.site,.site-content,#content,#primary,main.site-main{max-width:100%!important;min-width:0!important}
header,.site-header{max-width:100%!important}
img,svg,video,canvas{max-width:100%}
}
'''
          save_file('assets/css/mobile-viewport-fix.css',css)

          start='<!-- GRAMISS MOBILE VIEWPORT FIX START -->'; end='<!-- GRAMISS MOBILE VIEWPORT FIX END -->'
          block=start+'\n<link rel="stylesheet" id="gramiss-mobile-viewport-fix-css" href="<?php echo esc_url( get_stylesheet_directory_uri() . \'/assets/css/mobile-viewport-fix.css?v=20260817-1\' ); ?>" media="(max-width: 860px)">\n'+end
          if start in header and end in header:
              before,rest=header.split(start,1); _,after=rest.split(end,1); header=before+block+after
          elif '</head>' in header:
              header=header.replace('</head>',block+'\n</head>',1)
          else:
              raise RuntimeError('No </head>')

          needle="      thumb.addEventListener('click',activate,true);\n      thumb.addEventListener('keydown',function(event){"
          replacement="""      thumb.addEventListener('click',activate,true);
      var g3TouchStartX=0,g3TouchStartY=0,g3TouchMoved=false;
      thumb.addEventListener('touchstart',function(event){var t=event.changedTouches&&event.changedTouches[0];if(!t)return;g3TouchStartX=t.clientX;g3TouchStartY=t.clientY;g3TouchMoved=false;},{capture:true,passive:true});
      thumb.addEventListener('touchmove',function(event){var t=event.changedTouches&&event.changedTouches[0];if(!t)return;if(Math.abs(t.clientX-g3TouchStartX)>10||Math.abs(t.clientY-g3TouchStartY)>10)g3TouchMoved=true;},{capture:true,passive:true});
      thumb.addEventListener('touchend',function(event){if(!g3TouchMoved)activate(event);},{capture:true,passive:false});
      thumb.addEventListener('keydown',function(event){"""
          if 'g3TouchStartX' not in gallery:
              if needle not in gallery: raise RuntimeError('Gallery signature not found')
              gallery=gallery.replace(needle,replacement,1)
          gallery=gallery.replace('/* GRAMISS_PDP_GALLERY_SWITCH_V3 */','/* GRAMISS_PDP_GALLERY_SWITCH_V4_MOBILE_TAP */',1)
          save_file(rel,gallery)

          header=re.sub(r'product-runtime-gallery-fix\.js\?v=[0-9A-Za-z._-]+','product-runtime-gallery-fix.js?v=20260817-4',header)
          save_file('header.php',header)

          h=get_file('header.php'); c=get_file('assets/css/mobile-viewport-fix.css'); g=get_file(rel)
          checks=[
              ('mobile CSS','GRAMISS_MOBILE_VIEWPORT_FIX_V1' in c),
              ('overflow clamp','overflow-x:clip!important' in c),
              ('CSS loader','gramiss-mobile-viewport-fix-css' in h),
              ('gallery marker','GRAMISS_PDP_GALLERY_SWITCH_V4_MOBILE_TAP' in g),
              ('touch tap',"thumb.addEventListener('touchend'" in g),
              ('gallery version','product-runtime-gallery-fix.js?v=20260817-4' in h),
          ]
          for label,ok in checks: print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(ok for _,ok in checks): raise SystemExit('Verification failed')
          print('LIVE MOBILE VIEWPORT + GALLERY TAP FIX DEPLOYED AND VERIFIED')
          PY
