    branches: [ops/seo-content-architecture-v1]

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit native category title source
        run: python3 .ops/category-native-title-source-audit-v2.py
