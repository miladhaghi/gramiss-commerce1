name: cPanel PDP No Flash

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/pdp-noflash'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy-layout flash from live PDP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(func, params, post=False):
              url=f'https://{host}:2083/execute/Fileman/{func}'
              enc=urllib.parse.urlencode(params).encode(); last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+enc.decode(), data=enc if post else None, method='POST' if post else 'GET')
                      req.add_header('Authorization', f'cpanel {user}:{token}')
                      if post: req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req, context=ctx, timeout=75) as r:
                          payload=json.loads(r.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1:
                          raise RuntimeError(f'{func} failed: {result.get("errors") if isinstance(result,dict) else "unknown"}')
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/5 failed for {func}: {exc}')
                      if attempt<5: time.sleep(attempt*4)
              raise last

          def get_file(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for k in ('content','file_content','data'):
                      if isinstance(data.get(k),str): return data[k]
              if isinstance(data,str): return data
              raise RuntimeError(f'Unexpected content for {rel}')

          def save_file(rel, content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel)
              directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},post=True)

          js=Path('deploy/pdp-noflash/product-runtime-fix.js').read_text(encoding='utf-8')
          header=get_file('header.php')
          start='<!-- GRAMISS PDP RUNTIME REBUILD START -->'
          end='<!-- GRAMISS PDP RUNTIME REBUILD END -->'
          if start not in header or end not in header:
              raise RuntimeError('Live PDP runtime loader markers were not found in header.php')

          block=f'''{start}\n<?php if ( function_exists( 'is_product' ) && is_product() ) : ?>\n<script id="gramiss-pdp-first-paint-gate">\n(function(d,w){{d.documentElement.classList.add('gramiss-pdp-booting');w.setTimeout(function(){{d.documentElement.classList.remove('gramiss-pdp-booting');}},3500);}})(document,window);\n</script>\n<style id="gramiss-pdp-first-paint-style">\nhtml.gramiss-pdp-booting body.single-product main.site-main,\nhtml.gramiss-pdp-booting body.single-product .site-main{{visibility:hidden!important;opacity:0!important;pointer-events:none!important;min-height:70vh!important;}}\n</style>\n<link id="gramiss-pdp-runtime-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/product-runtime-fix.css?v=20260809-3' ); ?>">\n<script id="gramiss-pdp-runtime-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/product-runtime-fix.js?v=20260812-4' ); ?>"></script>\n<?php endif; ?>\n{end}'''

          before=header.split(start,1)[0]
          after=header.split(end,1)[1]
          header_new=before+block+after

          save_file(f'header.php.bak-pdpnoflash-{stamp}',header)
          print('Backup: header.php.bak-pdpnoflash-'+stamp)
          save_file('assets/js/product-runtime-fix.js',js)
          save_file('header.php',header_new)

          live_header=get_file('header.php')
          live_js=get_file('assets/js/product-runtime-fix.js')
          checks={
              'first-paint gate': 'gramiss-pdp-first-paint-gate' in live_header and 'gramiss-pdp-booting' in live_header,
              'safe inline fallback': '3500' in live_header,
              'runtime v4 loader': 'product-runtime-fix.js?v=20260812-4' in live_header,
              'runtime v4 marker': 'GRAMISS_PDP_RUNTIME_V4' in live_js,
              'no animation-frame delay': 'requestAnimationFrame(init)' not in live_js,
              'synchronous parsed-DOM init': 'if(document.body)' in live_js and 'init();' in live_js,
              'boot release': "classList.remove('gramiss-pdp-booting')" in live_js,
              'legacy isolation kept': 'g3-related-zone' in live_js and 'data-gramiss-pdp-legacy-hidden' in live_js,
          }
          for label,ok in checks.items(): print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()): raise SystemExit('PDP no-flash verification failed')
          print('LIVE PDP NO-FLASH V4 DEPLOYED AND VERIFIED')
          PY
