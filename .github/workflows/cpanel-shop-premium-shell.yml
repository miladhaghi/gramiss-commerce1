name: cPanel Shop Premium Shell

on:
  pull_request:
    branches: [main]

jobs:
  deploy:
    if: github.head_ref == 'ops/shop-premium-shell'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - name: Checkout Gramiss source
        uses: actions/checkout@v4
        with:
          ref: wordpress-migration
      - name: Deploy premium Shop shell and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, ssl, time, urllib.parse, urllib.request
          from pathlib import Path

          host=os.environ['CPANEL_HOST']; user=os.environ['CPANEL_USER']; token=os.environ['CPANEL_TOKEN']; root=os.environ['THEME_ROOT'].strip('/')
          ctx=ssl._create_unverified_context(); stamp=time.strftime('%Y%m%d-%H%M%S', time.gmtime())

          def call(fn,p,post=False):
              url=f'https://{host}:2083/execute/Fileman/{fn}'; data=urllib.parse.urlencode(p).encode(); last=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url if post else url+'?'+data.decode(),data=data if post else None,method='POST' if post else 'GET')
                      req.add_header('Authorization',f'cpanel {user}:{token}')
                      if post:req.add_header('Content-Type','application/x-www-form-urlencoded')
                      with urllib.request.urlopen(req,context=ctx,timeout=45) as response: payload=json.loads(response.read().decode('utf-8'))
                      result=payload.get('result') if isinstance(payload.get('result'),dict) else payload
                      if not isinstance(result,dict) or result.get('status')!=1: raise RuntimeError(str(result.get('errors') if isinstance(result,dict) else result))
                      return result.get('data')
                  except Exception as exc:
                      last=exc; print(f'Attempt {attempt}/3 {fn}: {exc}')
                      if attempt<3: time.sleep(attempt*2)
              raise last

          def read(rel):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              data=call('get_file_content',{'dir':directory,'file':name,'from_charset':'_DETECT_','to_charset':'utf-8'})
              if isinstance(data,dict):
                  for key in ('content','file_content','data'):
                      if isinstance(data.get(key),str):return data[key]
              if isinstance(data,str):return data
              raise RuntimeError(rel)

          def save(rel,content):
              parent,name=rel.rsplit('/',1) if '/' in rel else ('',rel); directory=root if not parent else f'{root}/{parent}'
              call('save_file_content',{'dir':directory,'file':name,'content':content,'from_charset':'UTF-8','to_charset':'UTF-8','fallback':'0'},True)

          src=Path('wordpress/gramiss-theme')
          php=(src/'inc/shop-premium-shell.php').read_text(encoding='utf-8')
          css=(src/'assets/css/shop-premium-shell.css').read_text(encoding='utf-8')
          js=(src/'assets/js/shop-premium-shell.js').read_text(encoding='utf-8')
          if 'gramiss_shop_premium_hero' not in php or 'gramiss_shop_premium_controls_open' not in php or '$query_archive' not in php: raise SystemExit('PHP source marker missing')
          if 'GRAMISS_SHOP_PREMIUM_SHELL_V1' not in css or 'GRAMISS_SHOP_PREMIUM_SHELL_JS_V1' not in js: raise SystemExit('Asset marker missing')
          if '.gse-media-frame{height:' in css or '.gse-media-frame img{width:' in css or 'ul.products.gse-products{width:' in css: raise SystemExit('Refusing deploy: card/image sizing rule detected')

          header=read('header.php'); save(f'header.php.bak-shop-premium-{stamp}',header)
          save('inc/shop-premium-shell.php',php); save('assets/css/shop-premium-shell.css',css); save('assets/js/shop-premium-shell.js',js)

          start='<!-- GRAMISS SHOP PREMIUM SHELL START -->'; end='<!-- GRAMISS SHOP PREMIUM SHELL END -->'
          block=start+'''\n<?php require_once get_stylesheet_directory() . '/inc/shop-premium-shell.php'; ?>\n<link id="gramiss-shop-premium-shell-css" rel="stylesheet" href="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/css/shop-premium-shell.css?v=20260819-3' ); ?>">\n<script id="gramiss-shop-premium-shell-js" defer src="<?php echo esc_url( get_stylesheet_directory_uri() . '/assets/js/shop-premium-shell.js?v=20260819-3' ); ?>"></script>\n'''+end
          if start in header and end in header: header_new=header.split(start,1)[0]+block+header.split(end,1)[1]
          elif '</head>' in header: header_new=header.replace('</head>',block+'\n</head>',1)
          else: raise SystemExit('No </head> marker in live header')
          save('header.php',header_new)

          live_header=read('header.php'); live_php=read('inc/shop-premium-shell.php'); live_css=read('assets/css/shop-premium-shell.css'); live_js=read('assets/js/shop-premium-shell.js')
          checks={
              'unconditional loader':"require_once get_stylesheet_directory() . '/inc/shop-premium-shell.php';" in live_header and 'shop-premium-shell.css?v=20260819-3' in live_header and 'shop-premium-shell.js?v=20260819-3' in live_header,
              'hero hook':'gramiss_shop_premium_hero' in live_php,
              'query archive detection':'$query_archive' in live_php and "'product' === sanitize_key" in live_php,
              'control shell':'gramiss_shop_premium_controls_open' in live_php,
              'drawer':'gramiss-shop-filter-drawer' in live_php and 'gramiss-shop-filter-overlay' in live_js,
              'style tip':'addStyleTip' in live_js and 'gramiss-shop-style-tip' in live_css,
              'dimensions preserved':'.gse-media-frame{height:' not in live_css and '.gse-media-frame img{width:' not in live_css and 'ul.products.gse-products{width:' not in live_css,
          }
          for label,ok in checks.items():print(('PASS' if ok else 'FAIL')+': '+label)
          if not all(checks.values()):raise SystemExit('Live file verification failed')

          verify_url='https://gramiss.ir/?'+urllib.parse.urlencode({'post_type':'product','_gramiss_shell_check':stamp})
          req=urllib.request.Request(verify_url,headers={'User-Agent':'GramissDeployCheck/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,context=ctx,timeout=45) as response: html=response.read().decode('utf-8','replace'); status=response.status
          print('Shop HTTP status:',status)
          print('Hero marker in HTML:', 'gramiss-shop-premium-hero' in html)
          print('CSS loader in HTML:', 'shop-premium-shell.css?v=20260819-3' in html)
          if status!=200 or 'gramiss-shop-premium-hero' not in html or 'shop-premium-shell.css?v=20260819-3' not in html:raise SystemExit('Live HTML verification failed')
          print('LIVE PREMIUM SHOP SHELL DEPLOYED AND VERIFIED — EXISTING CARD AND PRODUCT IMAGE SIZES PRESERVED')
          PY
