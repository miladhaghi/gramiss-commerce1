name: Home Journal V3 Comment Trigger

on:
  issue_comment:
    types: [created]

jobs:
  deploy:
    if: github.event.issue.pull_request && github.event.comment.body == '/deploy-home-journal-v3'
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: cip20.mizbanfadns.net
      CPANEL_USER: gramissi
      CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
      THEME_ROOT: public_html/wp-content/themes/gramiss-theme-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run guarded Home Journal V3 live deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          src=Path('.github/workflows/cpanel-home-journal-v3-final.yml').read_text(encoding='utf-8')
          marker="          python3 - <<'PY'\n"
          start=src.index(marker)+len(marker)
          end=src.index("\n          PY",start)
          block=src[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/home_journal_v3_deploy.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PYEXTRACT
          python3 /tmp/home_journal_v3_deploy.py
