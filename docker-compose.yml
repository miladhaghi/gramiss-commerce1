services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gramiss
      POSTGRES_USER: gramiss
      POSTGRES_PASSWORD: gramiss_local_only
    ports:
      - "5432:5432"
    volumes:
      - gramiss_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramiss -d gramiss"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - gramiss_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gramiss_postgres:
  gramiss_redis:
